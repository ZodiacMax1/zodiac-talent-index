<script>
(function(){
var STAGES=['Shortlisted','Outreach','Negotiating','Confirmed'];
var APPROVED=['Yes','Maybe','Not yet','Declined'];
var CONTRACT=['–','Sent','Signed'];
var CONTENT=['–','In production','Received','Feedback','Approved'];
var INVOICE=['Not invoiced','Invoiced','Part paid','Paid'];
var DSTAGES=['Brief sent','In production','Draft received','Feedback','Approved','Live'];
var MONDAY=['2 - Discovery / Scoping','3 - Proposal Sent','4 - Negotiation','5 - Verbal Agreement','6 - Contract Sent','7 - Won','8 - Closed Lost'];
function stcls(st){return st==='7 - Won'?'ok':st==='8 - Closed Lost'?'bad':'warn';}
var CSTATUS=['Not started','Sent to client','Signed'];
var TERMS=['Upfront','Net 30','Net 45','Net 60'];
var TODAY='2027-03-06';var SYM={GBP:'£',USD:'$',AED:''};var FXD={GBP:1,USD:0.75,AED:0.2};var REASONS=['Dropped out','Client request','Budget','Contract issue','Availability','Other'];
function calc(b,m){return b/(1-m/100);}
var TAL=[],CAMPS=[],FULL=null,ROLE='view',ME=null,READY=false,TOKEN=null,LISTERR='';
try{TOKEN=localStorage.getItem('zodiacTalentToken_v2');}catch(e){}
function canEdit(){return ROLE==='edit';}
function api(path,opts){
  opts=opts||{};var h={'content-type':'application/json'};if(TOKEN)h.authorization='Bearer '+TOKEN;
  return fetch('/api'+path,{method:opts.method||'GET',headers:h,body:opts.body!==undefined?JSON.stringify(opts.body):undefined}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      if(r.status===401){try{parent.postMessage('zodiac-locked','*');}catch(e){}throw new Error('Please sign in again');}
      if(!r.ok)throw new Error(j.error||'Something went wrong');return j;});});
}
function fmtFolT(n){return n>=1e6?(n/1e6).toFixed(n%1e6===0?0:1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(n);}
function platOf(t){var o=[];if(t.ig_followers)o.push('IG '+fmtFolT(t.ig_followers));if(t.tt_followers)o.push('TT '+fmtFolT(t.tt_followers));if(t.yt_followers)o.push('YT '+fmtFolT(t.yt_followers));return o.join(' · ');}
function ix(t){var f=FULL&&FULL.infl.filter(function(i){return i.tid===t;})[0];if(f)return f;return TAL.filter(function(x){return x.id===t;})[0]||{name:'Unknown',plat:'',region:'',niche:'',mgr:'',email:'',phone:''};}
function sub(t){var x=ix(t);return x.region||'';}
var _n=new Date();function p2(n){return (n<10?'0':'')+n;}
var TODAY=_n.getFullYear()+'-'+p2(_n.getMonth()+1)+'-'+p2(_n.getDate());
var SYM={GBP:'£',USD:'$',AED:''};var FXD={GBP:1,USD:0.75,AED:0.2};var REASONS=['Dropped out','Client request','Budget','Contract issue','Availability','Other'];
function fdy(iso){if(!iso)return '';return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fts(iso){if(!iso)return '';var d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fsize(n){n=Number(n)||0;return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
function hydrate(c){
  c.dates=c.start&&c.end?(c.start.slice(0,4)!==c.end.slice(0,4)?fdy(c.start):fd(c.start))+' – '+fdy(c.end):c.start?'From '+fdy(c.start):c.end?'Until '+fdy(c.end):'Dates TBC';
  (c.infl||[]).forEach(function(i){i.comments.forEach(function(m){m.at=fts(m.at);});i.quotes.forEach(function(q){q.d=fd(String(q.d).slice(0,10));});if(i.archived&&i.archived.date&&/^\d{4}/.test(i.archived.date))i.archived.date=fd(i.archived.date);});
  return c;
}
var CUR=null;
var S={sd:{per:'ytd',owner:'All',cur:'GBP',all:false},backv:null,clientPage:null,backc:null,gcol:{},mdCol:{},clientPop:null,lf:{q:'',client:'All',stage:'All',owner:'All',group:'Stage'},ltab:'Active',dockind:'Client deck',tick:0,dfs:'All',dfg:'All',view:'campaigns',cid:null,tab:'Influencers',filter:'All',sel:null,adding:false,newc:false,pick:false,pickTab:'Index',pickSel:{},pickQ:'',pickReg:'All',pickMsg:'',editC:false,editSec:null,dd:null,dtab:'Overview',addDel:false,editD:false,editI:false,rmd:null,archiving:false};
function camp(){return FULL&&FULL.id===S.cid?FULL:null;}
function won(c){return c.stage==='7 - Won';}
function base(i){return i.neg||i.initial;}
function moneyIn(n,c){var cur=(c&&c.cur)||'GBP';return cfmt(cur==='AED'?'AED ':SYM[cur]||'',n);}
function cfmt(sym,n,txt){n=Number(n)||0;return (n<0?'-':'')+sym+(txt!=null?txt:Math.abs(Math.round(n)).toLocaleString('en-GB'));}
function money(n){return moneyIn(n,CUR);}
function pn(n){return Math.round(n).toLocaleString('en-GB');}
function gbpIn(n,c){return cfmt('£',n*c.fx);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function initials(n){return n.replace(/[^A-Za-z0-9\s]/g,' ').trim().split(/\s+/).map(function(p){return p.charAt(0);}).join('').slice(0,2).toUpperCase();}
function cls(v){
  if(['Yes','Confirmed','Signed','Approved','Live','Paid'].indexOf(v)>-1)return 'ok';
  if(['Maybe','Negotiating','Sent','Sent to client','In production','Invoiced','Part paid','Received','Draft received'].indexOf(v)>-1)return 'warn';
  if(['Declined','Feedback'].indexOf(v)>-1)return 'bad';
  if(['Outreach'].indexOf(v)>-1)return 'brand-p';
  return 'neu';
}
function sel(field,val,opts,iid,attr){
  return '<select class="sel '+cls(val)+'" data-f="'+field+'" data-i="'+iid+'" aria-label="'+field+'">'+opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
}
function selected(c){return c.infl.filter(function(i){return i.approved==='Yes'&&!i.archived;});}
function fd(iso){if(!iso)return '–';var d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function dinfo(d){
  if(d.noPost){var fs=d.recv;
    if(d.stage==='Live'||(fs&&fs<TODAY))return {k:'ok',t:'Filmed',done:true,key:fs||'9',w:'Filming',date:fs};
    if(!fs)return {k:'neu',t:'No date',key:'9',w:'Filming',date:''};
    var fd0=Math.round((new Date(fs)-new Date(TODAY))/864e5);
    if(fd0===0)return {k:'warn',t:'Today',key:fs,w:'Filming',date:fs,diff:0};
    if(fd0<=3)return {k:'warn',t:'In '+fd0+(fd0===1?' day':' days'),key:fs,w:'Filming',date:fs,diff:fd0};
    return {k:'neu',t:'In '+fd0+' days',key:fs,w:'Filming',date:fs,diff:fd0};}
  var done=d.stage==='Live';
  if(d.stage==='Approved'&&d.live){var df=Math.round((new Date(d.live)-new Date(TODAY))/864e5);return {k:df<0?'bad':'warn',t:df<0?(-df)+(df===-1?' day':' days')+' late to post':'Approved · not posted',key:d.live,w:'Go live',date:d.live,diff:df};}
  if(done)return {k:'ok',t:'Done',done:true,key:d.live||d.recv||'9',w:'Went live',date:d.live};
  var early=DSTAGES.indexOf(d.stage)<=1,ds=early?d.recv:d.live,w=early?'Receive by':'Go live';
  if(!ds)return {k:'neu',t:'No date',key:'9',w:w,date:''};
  var diff=Math.round((new Date(ds)-new Date(TODAY))/864e5);
  if(diff<0)return {k:'bad',t:(-diff)+(diff===-1?' day overdue':' days overdue'),key:ds,w:w,date:ds,diff:diff};
  if(diff===0)return {k:'warn',t:'Due today',key:ds,w:w,date:ds,diff:0};
  if(diff<=3)return {k:'warn',t:'Due in '+diff+(diff===1?' day':' days'),key:ds,w:w,date:ds,diff:diff};
  return {k:'neu',t:'In '+diff+' days',key:ds,w:w,date:ds,diff:diff};
}
function gap(due,act){if(!due||!act)return '';var n=Math.round((new Date(act)-new Date(due))/864e5);return n===0?'on time':n<0?(-n)+(n===-1?' day early':' days early'):n+(n===1?' day late':' days late');}
function mst(d,kind){
  if(d.noPost){if(kind==='live')return {k:'neu',big:'No posting',sub:'Filming or attendance only',state:'N/A',na:true};
    var fi=dinfo(d);if(fi.done)return {k:'ok',big:'Filmed '+fd(d.recv),sub:'Filming day',state:'Complete'};
    if(!d.recv)return {k:'neu',big:'No date',sub:'Add the filming date',state:'Not set'};
    return {k:fi.k,big:'Filming '+fd(d.recv),sub:fi.t,state:fi.k==='warn'?'Due soon':'Upcoming'};}
  var isR=kind==='recv',dl=isR?d.recv:d.live,done=isR?DSTAGES.indexOf(d.stage)>=2:d.stage==='Live',at=isR?(d.recvAt||d.recv):(d.liveAt||d.live);
  if(done)return {k:'ok',big:(isR?'Received ':'Posted ')+(at?fd(at):''),sub:dl?'Deadline '+fd(dl)+' · '+gap(dl,at):'No deadline set',state:'Complete'};
  if(!isR&&d.stage==='Approved'&&dl){var dd=Math.round((new Date(dl)-new Date(TODAY))/864e5);return {k:dd<0?'bad':'warn',big:'Due '+fd(dl),sub:dd<0?(-dd)+(dd===-1?' day':' days')+' overdue. Approved, not posted':'Approved, not posted',state:dd<0?'Overdue':'Needs posting'};}
  if(!dl)return {k:'neu',big:'No deadline',sub:'Add one with Edit',state:'Not set'};
  var diff=Math.round((new Date(dl)-new Date(TODAY))/864e5);
  if(diff<0)return {k:'bad',big:'Due '+fd(dl),sub:(-diff)+(diff===-1?' day':' days')+' overdue',state:'Overdue'};
  if(diff<=3)return {k:'warn',big:'Due '+fd(dl),sub:diff===0?'Due today':'In '+diff+(diff===1?' day':' days'),state:'Due soon'};
  return {k:'neu',big:'Due '+fd(dl),sub:'In '+diff+' days',state:'Upcoming'};
}
function mchip(d,kind){var m=mst(d,kind);var lab=kind==='recv'?'Content':'Post';var v=m.k==='ok'?'✓ '+m.big.replace(/^(Received|Posted) /,''):m.k==='neu'&&m.state==='Not set'?'–':m.big.replace('Due ','');return '<span class="mc k-'+m.k+'"><i>'+lab+'</i>'+v+(m.k==='bad'?' · late':'')+'</span>';}
function mini(d){var k=DSTAGES.indexOf(d.stage);return '<span class="mini">'+DSTAGES.map(function(x,j){return '<b class="'+(j<k||k===5?'d':j===k?'c':'')+'"></b>';}).join('')+'</span>';}
function syncStage(z,key){var k=DSTAGES.indexOf(z.stage);
  if(key==='recvAt'){if(z.recvAt&&k<2)z.stage='Draft received';if(!z.recvAt&&k===2)z.stage='In production';}
  if(key==='liveAt'){if(z.liveAt){z.stage='Live';if(!z.recvAt)z.recvAt=z.recv||z.liveAt;}else if(z.stage==='Live')z.stage='Approved';}}
function rcell(d){
  if(DSTAGES.indexOf(d.stage)>=2){var g=gap(d.recv,d.recvAt||d.recv);return '<div style="color:var(--ok-fg);font-weight:500">✓ Received'+((d.recvAt||d.recv)?' '+fd(d.recvAt||d.recv):'')+'</div><div class="small">'+(d.recv?'Due '+fd(d.recv)+' · '+g:'')+'</div>';}
  if(!d.recv)return '<span class="small">No deadline</span>';
  var late=d.recv<TODAY;return '<div style="'+(late?'color:var(--bad-fg);':'')+'font-weight:500">Due '+fd(d.recv)+'</div><div class="small">Not received yet</div>';
}
function lcell(d){
  if(d.stage==='Live'){var g=gap(d.live,d.liveAt||d.live);return '<div style="color:var(--ok-fg);font-weight:500">✓ Posted '+fd(d.liveAt||d.live)+'</div><div class="small">'+(d.live?'Due '+fd(d.live)+' · '+g:'')+'</div>';}
  if(!d.live)return '<span class="small">No date</span>';
  var late=d.live<TODAY;return '<div style="'+(late?'color:var(--bad-fg);':'')+'font-weight:500">Due '+fd(d.live)+'</div><div class="small">'+(d.stage==='Approved'?'Approved, not posted yet':'Not posted yet')+'</div>';
}
function dstate(d){var n=dinfo(d);return n.k==='bad'?'Overdue':n.k==='warn'?'Due soon':'';}
function dchip(d){var n=dinfo(d);if(n.k==='neu')return '';return '<span class="pill '+n.k+'">'+(n.done?'✓ Done':n.t)+'</span>';}
function stats(c){
  var ap=selected(c),cost=0,price=0;ap.forEach(function(i){cost+=base(i);price+=i.client;});
  var m=price-cost;return {cost:cost,price:price,m:m,pc:price>0?m/price*100:0,n:ap.length};
}
function pct(a,b){return b?Math.round(a/b*100):0;}
function dstages(i){if(!i.deliv.length)return '';return '<div class="small" style="margin-top:6px;line-height:1.5">'+i.deliv.map(function(d){return esc(d.name)+' · <b style="font-weight:500">'+(d.noPost?'Filming':esc(d.stage))+'</b>';}).join('<br>')+'</div>';}
function dsum(i){var t=i.deliv.length;if(!t)return '<span class="small">None yet</span>';var live=i.deliv.filter(function(d){return d.stage==='Live';}).length,od=i.deliv.filter(function(d){return dinfo(d).k==='bad';}).length,np=i.deliv.filter(function(d){return d.stage==='Approved';}).length;
  return '<div style="display:grid;gap:5px;min-width:130px"><div style="font-size:13px"><b style="font-weight:500">'+live+' of '+t+'</b> posted</div><div class="mini">'+i.deliv.map(function(d){var k=dinfo(d).k;return '<b class="'+(d.stage==='Live'?'d':k==='bad'?'x':k==='warn'?'w':'')+'"></b>';}).join('')+'</div>'+(od?'<div style="font-size:12px;color:var(--bad-fg)">'+od+' overdue</div>':np?'<div style="font-size:12px;color:var(--warn-fg)">'+np+' to post</div>':'')+'</div>';}
function progress(c){
  var s=selected(c),n=s.length,dels=[];s.forEach(function(i){i.deliv.forEach(function(d){dels.push(d);});});
  var live=dels.filter(function(d){return dinfo(d).done;}).length;
  var signed=s.filter(function(i){return i.contract==='Signed';}).length;
  var posts=dels.filter(function(d){return !d.noPost;}),appr=posts.filter(function(d){return d.stage==='Approved'||d.stage==='Live';}).length;
  var inv=s.filter(function(i){return i.invoice!=='Not invoiced';}).length;
  var paid=s.filter(function(i){return i.invoice==='Paid';}).length;
  return [['Deliverables complete',live,dels.length],['Contracts signed',signed,n],['Content approved',appr,posts.length],['Invoiced',inv,n],['Paid',paid,n]];
}
function prog(c){

var GROUPED=/stor(y|ies)/i;
function dItem(d){if(d.item)return {item:d.item,qty:d.qty||1};var m=String(d.name).match(/^\s*(\d+)\s*[×x]\s*(.+?)\s*$/);return m?{item:m[2],qty:+m[1]}:{item:String(d.name).replace(/\s+\d+$/,''),qty:1};}

function splitScope(item,qty,used,total,set){
  var noPost=['Filming day','Event / attendance'].indexOf(item)>=0;if(item==='Usage rights')return [];
  var plat=scPlat(item);
  if(GROUPED.test(item)){var sz=Math.max(1,Math.min(qty,Math.round(set)||qty)),n=Math.ceil(qty/sz),o2=[];
    if(n===1)return [{name:qty>1?qty+' × '+item:item,item:item,qty:qty,plat:plat,noPost:noPost}];
    var u2=used['set:'+item]||0;for(var k2=0;k2<n;k2++){var q2=k2<n-1?sz:qty-sz*(n-1);o2.push({name:q2+' × '+item+' · Set '+(u2+k2+1),item:item,qty:q2,plat:plat,noPost:noPost});}
    used['set:'+item]=u2+n;return o2;}
  var u=used[item]||0,all=total!=null?total:u+qty,out=[];
  for(var k=0;k<qty;k++)out.push({name:all>1?item+' '+(u+k+1):item,item:item,qty:1,plat:plat,noPost:noPost});
  used[item]=u+qty;return out;
}

/* Shift dates in bulk (client pushes the campaign back), with undo */
function dayTxt(n){var a=Math.abs(n),w=a%7===0&&a>=7;return (n>0?'+':'−')+(w?a/7+' week'+(a===7?'':'s'):a+' day'+(a===1?'':'s'));}
function shTargets(){
  var a=S.sh,c=FULL,out=[];if(!a||!c)return out;
  var selK=a.only&&S.dsel?Object.keys(S.dsel):null;
  selected(c).forEach(function(i){if(a.who!=='All'&&i.id!==a.who)return;
    i.deliv.forEach(function(d){
      if(selK&&selK.indexOf(i.id+'|'+d.id)<0)return;
      if(!d.recv&&!d.live)return;
      if(a.skip&&(d.stage==='Live'||d.liveAt))return;
      var first=d.recv&&d.live?(d.recv<d.live?d.recv:d.live):(d.recv||d.live);
      if(a.from&&(d.live||d.recv)<a.from)return;
      out.push({i:i,d:d,first:first});});});
  return out;
}

function apPlan(){
  var a=S.ap,un=calUnsched(FULL,true).filter(function(u){return a.who[u.iid];});
  var q={},order=[];un.forEach(function(u){if(!q[u.iid]){q[u.iid]=[];order.push(u.iid);}q[u.iid].push(u);});
  order.sort(function(x,y){return q[x][0].who<q[y][0].who?-1:1;});
  var slots=[];if(a.from&&a.to&&a.from<=a.to)for(var d=a.from;d<=a.to&&slots.length<800;d=addDays(d,1))if(a.days[new Date(d+'T00:00:00').getDay()])slots.push(d);
  var weeks=[],wk={};slots.forEach(function(d){var m=addDays(d,-((new Date(d+'T00:00:00').getDay()+6)%7));if(!wk[m]){wk[m]=[];weeks.push(m);}wk[m].push(d);});
  var load={},out=[],every=a.per<1?2:1,per=a.per<1?1:a.per;
  var W=weeks.filter(function(m,wi){return wi%every===0;});
  order.forEach(function(iid,ci){var n=q[iid].length,cw={},cd={},off=ci/Math.max(order.length,1),items=q[iid].slice();q[iid]=[];

        var cand=wk[m].filter(function(d){return (load[d]||0)<a.max&&!cd[d];});if(!cand.length)continue;

function calPlace(key,date,rowIid){

function calAddGo(another){
  calAddSnap();var a=S.calAdd;a.err='';
  var ct=a.who.indexOf('ct:')===0?find(a.who.slice(3)):null;
  if(a.who==='__ix'&&!a.tid){a.err='Pick someone from the Talent Index.';render();return;}
  var isNew=!ct||!(ct.approved==='Yes'&&!ct.archived);
  if(!a.lines.length&&!isNew){a.err='Add at least one deliverable.';render();return;}
  if(a.recv&&a.live&&a.recv>a.live){a.err='Content due can’t be after the go-live date.';render();return;}
  a.busy=true;render();
  var ctId=ct?ct.id:null,who=ct?ix(ct.tid).name:(TAL.filter(function(t){return t.id===a.tid;})[0]||{}).name||'Creator';
  var go=function(path,method,body){return api(path,{method:method,body:body}).then(function(j){if(j.campaign)FULL=hydrate(j.campaign);return j;});};
  var p=Promise.resolve();
  if(!ct)p=p.then(function(){return go(P('/talents'),'POST',{talent_id:a.tid});}).then(function(){var n=FULL.infl.filter(function(i){return i.tid===a.tid;})[0];if(!n)throw new Error('Could not add them');ctId=n.id;});
  p=p.then(function(){if(isNew)return go(P('/talents/'+ctId),'PATCH',ct&&ct.archived?{approved:'Yes',archived:null}:{approved:'Yes'});});
  p=p.then(function(){
    if(!a.lines.length)return;
    var i=find(ctId),sc=(i.scope||[]).map(function(x){var o={item:x.item,qty:x.qty};if(x.rate!=null)o.rate=x.rate;return o;}),pend=i.deliv.length?[]:sc.map(function(x){return {item:x.item,qty:x.qty};}),used=usedMap(i),mk=[];
    a.lines.forEach(function(l){var f=sc.filter(function(x){return x.item===l.item;})[0];if(f)f.qty+=l.qty;else sc.push({item:l.item,qty:l.qty});});
    var q=go(P('/talents/'+ctId),'PATCH',{scope:sc});
    // creator had quoted scope but no deliverables yet: create those (undated) so they stay in To schedule
    var tot={};pend.concat(a.lines).forEach(function(x){tot[x.item]=(tot[x.item]||used[x.item]||0)+x.qty;});
    pend.forEach(function(x){splitScope(x.item,x.qty,used,tot[x.item]).forEach(function(y){mk.push(delBody(y));});});
    a.lines.forEach(function(l){splitScope(l.item,l.qty,used,tot[l.item]).forEach(function(y){mk.push(delBody(y,y.noPost?{recv:a.live}:{recv:a.recv,live:a.live}));});});
    mk.forEach(function(b){q=q.then(function(){return go(P('/talents/'+ctId+'/deliverables'),'POST',b);});});
    return q;
  });
  p.then(function(){
    var what=a.lines.map(function(l){return l.qty+' × '+l.item;}).join(', ');
    toast((isNew?who+' added to Influencers':who)+(what?(isNew?' with ':': ')+what+(a.live?' · '+fd(a.live):' (to schedule)'):''));
    var lv=a.live;S.calAdd=another?{who:'ct:'+ctId,tid:'',lines:[],other:false,recv:'',live:lv,err:''}:null;
    if(lv&&S.calV!=='Year'){S.calM=lv.slice(0,7);S.calPick=lv.slice(0,7);}
    render();
  }).catch(function(er){if(S.calAdd){S.calAdd.busy=false;S.calAdd.err=er.message||'Something went wrong';}render();loadOne(true);});
}

function socHandle(u,kind){if(!u)return '';var m=String(u).match(kind==='yt'?/youtube\.com\/(@[^\/?#]+|c\/[^\/?#]+|channel\/[^\/?#]+|user\/[^\/?#]+)/i:kind==='tt'?/tiktok\.com\/(@[^\/?#]+)/i:/instagram\.com\/([^\/?#]+)/i);
  if(m)return kind==='ig'?'@'+m[1]:m[1].replace(/^(c|user|channel)\//,'');return String(u).replace(/^https?:\/\/(www\.)?/,'');}
function socUrl(u,kind){if(!u)return '';u=String(u).trim();if(/^https?:\/\//i.test(u))return u;var h=u.replace(/^@/,'');
  return kind==='ig'?'https://www.instagram.com/'+h:kind==='tt'?'https://www.tiktok.com/@'+h:'https://www.youtube.com/@'+h;}

/* ================= Payments: rate card, per-deliverable payments, client & creator invoices ================= */
var BILL=[['completion','On completion'],['quarterly','Quarterly upfront'],['monthly','Monthly upfront'],['custom','Custom']];
var PST={'Paid':'ok','Invoiced':'warn','Not due':'neu'};
function r2(n){return Math.round(n*100)/100;}
function crRateOf(i,d){
  if(d.crRate!=null)return d.crRate;
  var sc=i.scope||[],di=dItem(d),q=di.qty,it=di.item;
  var l=sc.filter(function(x){return x.item===it;})[0];
  return l&&l.rate!=null?r2(q*l.rate):null;
}
function dDate(d){return (d.noPost?d.recv:d.live)||'';}
function cinvFor(c,d){var v=c.cinv||[],dt=dDate(d);
  if(dt){var p=v.filter(function(x){return x.start&&x.end&&dt>=x.start&&dt<=x.end;})[0];if(p)return p;}
  return v.filter(function(x){return !x.start&&!x.end;})[0]||null;}
function cliSt(inv){return !inv?'Not due':inv.paidAt?'Paid':inv.invAt?'Invoiced':'Not due';}
function isPosted(d){return d.stage==='Live'||(d.noPost&&d.recv&&d.recv<=TODAY);}
function payPill(st,attrs){return '<span class="pill '+PST[st]+'"'+(attrs||'')+'>'+st+'</span>';}
function liveCell(d){
  var dl=dDate(d);
  if(isPosted(d)){var at=d.noPost?d.recv:(d.liveAt||d.live),late=d.live&&at&&at>d.live?Math.round((new Date(at)-new Date(d.live))/864e5):0;
    return '<span class="lv ok">✓ '+(at?fd(at):'Posted')+'</span><div class="small">'+(d.noPost?'Filmed':late?late+(late===1?' day':' days')+' late':'Posted on time')+'</div>';}
  if(!dl)return '<span class="lv">No date</span>';
  if(dl<TODAY)return '<span class="lv bad">'+fd(dl)+'</span><div class="small" style="color:var(--bad-fg)">Not posted</div>';
  return '<span class="lv">'+fd(dl)+'</span>';
}
function crTotals(i){var t=0,p=0;i.deliv.forEach(function(d){var r=crRateOf(i,d)||0;t+=r;if(d.crStatus==='Paid')p+=r;});return {t:t,p:p};}

function rateCard(i,c){
  var sc=i.scope||[],ed=canEdit(),pieces=0,tot=0,all=sc.length>0;
  sc.forEach(function(x){pieces+=x.qty;if(x.rate!=null)tot+=x.qty*x.rate;else all=false;});
  var h='<div><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 class="sh" style="margin:0">Rate card</h2>'+(ed&&sc.length?'<button class="btn sm" data-sced="'+i.id+'">Edit quantities</button>':'')+'</div>';
  if(!sc.length)return h+'<div class="small" style="margin-bottom:8px">No deliverables quoted yet.</div>'+(ed?'<button class="btn sm" data-sced="'+i.id+'">+ Add deliverables</button>':'')+'</div>';
  h+='<table class="pt"><colgroup><col style="width:44%"><col style="width:14%"><col style="width:21%"><col style="width:21%"></colgroup><thead><tr><th>Deliverable</th><th class="c">Quantity</th><th class="r">Creator rate</th><th class="r">Total</th></tr></thead><tbody>';
  sc.forEach(function(x,k){h+='<tr><td><b>'+esc(x.item)+'</b></td><td class="c num">'+x.qty+'</td><td class="r">'+(ed?'<input class="in rc" inputmode="decimal" data-rcr="'+i.id+'|'+k+'" value="'+(x.rate!=null?money(x.rate):'')+'" placeholder="Set rate" aria-label="Creator rate for '+esc(x.item)+'">':'<span class="num">'+(x.rate!=null?money(x.rate):'–')+'</span>')+'</td><td class="r num"><b>'+(x.rate!=null?money(x.qty*x.rate):'–')+'</b></td></tr>';});
  h+='</tbody><tfoot><tr><td><b>Total</b></td><td class="c num"><b>'+pieces+'</b></td><td></td><td class="r num"><b>'+(tot?money(tot):'–')+'</b></td></tr></tfoot></table>';
  var b=base(i);
  if(ed&&b>0&&pieces>0&&(!all||Math.abs(tot-b)>0.5))h+='<div class="small" style="margin-top:8px">Only know the total fee? <button class="lkb" data-act="rcsplit">Split '+money(b)+' across the '+pieces+'</button></div>';
  if(all&&b>0&&Math.abs(tot-b)>0.5)h+='<div class="small" style="margin-top:6px;color:var(--warn-fg)">Rate card total '+money(tot)+' vs creator rate '+money(b)+'. Saving a rate updates the negotiated rate to the card total.</div>';
  return h+'</div>';
}
function saveRateCard(i,sc){
  var tot=0,ok=true;sc.forEach(function(x){if(x.rate!=null)tot+=x.qty*x.rate;else ok=false;});
  var b={scope:sc};if(ok&&tot>0&&Math.abs(tot-base(i))>0.005)b.neg=r2(tot);
  post(P('/talents/'+i.id),'PATCH',b,{msg:b.neg?'Rate card saved · negotiated rate now '+money(tot):'Rate card saved'});
}

function payTable(i,c){

  var card=0;(i.scope||[]).forEach(function(x){if(x.rate!=null)card+=x.qty*x.rate;});
  if(card-t.t>0.5)h+='<div class="small" style="margin:-4px 0 10px">'+money(card-t.t)+' of the rate card isn’t on a deliverable yet. Add the rest on the Deliverables tab or the Content Calendar.</div>';
  if(ed)h+='<label class="crdrop" id="crdrop" data-crct="'+i.id+'"><span class="crup" aria-hidden="true">↥</span><span style="flex:1"><b style="font-weight:500">Drop a creator invoice</b><span class="small" style="display:block">Onto a row to invoice that deliverable, or here to pick which deliverables it covers</span></span><span class="btn sm">Choose file</span><input type="file" id="crfile" data-crct="'+i.id+'" accept=".pdf,image/*,.doc,.docx" style="display:none"></label>';
  h+='<table class="pt"><colgroup><col style="width:22%"><col style="width:9%"><col style="width:16%"><col style="width:17%"><col style="width:16%"><col style="width:20%"></colgroup><thead><tr><th>Deliverable</th><th>Content</th><th>Live</th><th class="r">Creator rate</th><th class="c">Client payment</th><th class="c">Creator payment</th></tr></thead><tbody>';

    var r=crRateOf(i,d),ci=cinvFor(c,d),cs=cliSt(ci),v=inv[d.crInv],pd=isPosted(d);

    h+='<tr data-crrow="'+i.id+'|'+d.id+'"><td><button class="lkb strong" data-dd="'+i.id+'|'+d.id+'">'+esc(d.name)+' <span style="color:var(--accent)">↗</span></button>'+(d.noPost?'<div class="small">Filming day</div>':'')+'</td>'
      +'<td class="small">'+(d.noPost?'–':d.recv?fd(d.recv):'–')+'</td><td>'+liveCell(d)+'</td>'
      +'<td class="r">'+(ed?'<input class="in rc" inputmode="decimal" data-crr="'+i.id+'|'+d.id+'" value="'+(r!=null?money(r):'')+'" placeholder="Set" title="'+(d.crRate!=null?'Set by hand. Clear it to use the rate card':'From the rate card')+'" aria-label="Creator rate">':'<span class="num">'+(r!=null?money(r):'–')+'</span>')+'</td>'
      +'<td class="c">'+payPill(cs)+'<div class="small">'+esc(ci?ci.label:'No invoice')+'</div></td>'
      +'<td class="c">'+(ed?'<button class="pillb" data-crst="'+i.id+'|'+d.id+'" title="Click to change">'+payPill(d.crStatus)+'</button>':payPill(d.crStatus))+(v?'<div><button class="pdfb" data-crpdf="'+i.id+'|'+v.id+'"'+(v.file?'':' disabled')+'><span class="pdf">PDF</span>'+esc(v.number||'Invoice')+'</button></div>':'')+'<div class="small">'+note+'</div></td></tr>';
  });
  h+='</tbody></table><div class="small" style="margin-top:8px">Client payment follows the invoices on the Financials tab. A creator can only be marked paid once the content is live and the client has paid for it.</div></div>';
  return h;
}

function crInvModal(){
  var m=S.crInv,i=find(m.ct),c=FULL;if(!i||!c)return '';
  var tick=0,anyHold=false,rows='';
  i.deliv.forEach(function(d){var r=crRateOf(i,d),paid=d.crStatus==='Paid',on=!!m.dids[d.id],cs=cliSt(cinvFor(c,d));

var DEALS=null,RNOTES={},RCFG=null,DEALSAT='',DEALERR='',DLOAD=false;
var MFX={GBP:1,USD:0.75,AED:0.2,EUR:0.85,SAR:0.2};
function loadDeals(fresh){if(DLOAD)return;DLOAD=true;
  api('/campaigns/monday-pipeline'+(fresh?'?fresh=1':'')).then(function(j){DEALS=j.deals||[];RNOTES=j.notes||{};RCFG=j.cfg||null;DEALSAT=j.at;DEALERR='';DLOAD=false;_SR=null;render();})
    .catch(function(e){DEALERR=e.message;DLOAD=false;if(DEALS===null)DEALS=false;render();});}
var _SR=null,_SRK='';
function SROWS(){
  if(!DEALS)return CAMPS;
  var k=DEALSAT+'|'+CAMPS.length;if(_SR&&_SRK===k)return _SR;
  var byM={};CAMPS.forEach(function(c){if(c.mondayItemId)byM[c.mondayItemId]=c;});
  var out=DEALS.filter(function(d){return d.stage&&!/^1-/.test(d.stage);}).map(function(d){
    var c=byM[d.id],won=['7 - Won','Invoiced','Invoice Paid'].indexOf(d.stage)>-1,fx=MFX[d.cur]||1,t=d.target!=null?d.target:(c?c.target:null);
    var costed=!!(c&&c.selected>0),cost=costed?c.cost*(d.cur===c.cur?1:(c.fx||1)/fx):(t!=null?d.value*(1-t/100):0);
    var invD=d.invSent||d.paid||'';
    return {id:c?c.id:'m:'+d.id,mondayItemId:d.id,name:d.name,client:d.client||(c&&c.client)||'',owner:(d.owner||'').split(',')[0].trim()||(c&&c.owner)||'Unassigned',
      stage:won?'7 - Won':d.stage,mstage:d.stage,cur:d.cur,fx:fx,budget:d.value,cost:cost,selected:costed||t!=null?1:0,target:t,
      start:d.start||d.agreed||'',created:d.agreed||d.start||'',wonAt:won?(d.agreed||d.start||''):'',markets:d.market||'',
      invs:invD?[{d:invD,v:d.value,c:cost}]:[],deliverables:c?c.deliverables:0,live:c?c.live:0,fnote:'',prob:d.prob,next:d.next||'',paid:d.stage==='Invoice Paid'||d.invStatus==='Paid',lostReason:d.lostReason};
  });
  // campaigns made by hand here (no monday deal) still count
  CAMPS.forEach(function(c){if(!c.mondayItemId)out.push(c);});
  _SRK=k;_SR=out;return out;
}
function dealSrc(){return DEALS?'From monday · Agency Sales Pipeline · updated '+fts(DEALSAT):DEALERR?'Couldn’t read monday ('+DEALERR+'), showing campaigns in this app':'Reading monday…';}

var SD_STAGES=['2 - Discovery / Scoping','3 - Proposal Sent','4 - Negotiation','5 - Verbal Agreement','6 - Contract Sent'];
function sdRange(per){
  var t=new Date(TODAY+'T00:00:00'),y=t.getFullYear(),m=t.getMonth(),z=function(n){return ('0'+n).slice(-2);},p=function(d){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());};
  if(per==='m0')return [p(new Date(y,m,1)),p(new Date(y,m+1,0))];
  if(per==='m1')return [p(new Date(y,m-1,1)),p(new Date(y,m,0))];
  if(per==='q0'){var q=Math.floor(m/3)*3;return [p(new Date(y,q,1)),p(new Date(y,q+3,0))];}
  if(per==='ytd')return [y+'-01-01',y+'-12-31'];
  if(per==='l12')return [p(new Date(y,m-11,1)),p(new Date(y,m+1,0))];
  if(/^y\d{4}$/.test(per))return [per.slice(1)+'-01-01',per.slice(1)+'-12-31'];
  return null;
}
function sdDate(c){return String(c.start||c.created||'').slice(0,10);}
function sdAed(){var r=0.2;return r;}
function sdM(n){
  var a=S.sd.cur==='AED',v=a?n/sdAed():n,ab=Math.abs(v),s;
  if(ab>=1e6)s=(ab/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';else if(ab>=1e4)s=Math.round(ab/1e3)+'k';else if(ab>=1e3)s=(ab/1e3).toFixed(1).replace(/\.0$/,'')+'k';else s=String(Math.round(ab));
  return cfmt(a?'AED ':'£',v,s);
}
function sdMF(n){var a=S.sd.cur==='AED';return cfmt(a?'AED ':'£',a?n/sdAed():n);}
function sdFd(d){if(!d)return '–';var y=d.slice(0,4),t=TODAY.slice(0,4);return (+d.slice(8,10))+' '+MN[+d.slice(5,7)-1]+(y!==t?" '"+y.slice(2):'');}
function sdPct(a,b){return b>0?(a/b*100).toFixed(1)+'%':'–';}
function sdCalc(){
  var rg=sdRange(S.sd.per),O=S.sd.owner;
  var d=SROWS().map(function(c){var g=c.fx||1;return {c:c,date:sdDate(c),bud:c.budget*g,cost:c.cost*g,costed:c.selected>0,owner:c.owner||'Unassigned',st:c.stage};});
  var scope=d.filter(function(x){return O==='All'||x.owner===O;});
  var per=scope.filter(function(x){return !rg||(x.date&&x.date>=rg[0]&&x.date<=rg[1]);});
  var won=per.filter(function(x){return x.st==='7 - Won';}),lost=per.filter(function(x){return x.st==='8 - Closed Lost';});
  var open=scope.filter(function(x){return SD_STAGES.indexOf(x.st)>-1;});
  var sum=function(a,f){return a.reduce(function(t,x){return t+f(x);},0);};
  var wc=won.filter(function(x){return x.costed;});
  var o={rg:rg,all:d,scope:scope,per:per,won:won,lost:lost,open:open,
    wv:sum(won,function(x){return x.bud;}),lv:sum(lost,function(x){return x.bud;}),ov:sum(open,function(x){return x.bud;}),
    cb:sum(wc,function(x){return x.bud;}),cc:sum(wc,function(x){return x.cost;})};
  o.margin=o.cb-o.cc;o.nc=wc.length;
  o.rate=won.length+lost.length?won.length/(won.length+lost.length)*100:null;
  o.avg=won.length?o.wv/won.length:0;
  return o;
}
function sdMonths(o){
  var rg=o.rg,from,to;
  var ds=o.per.map(function(x){return x.date;}).filter(Boolean).sort();
  if(rg&&S.sd.per!=='all'){from=rg[0].slice(0,7);to=rg[1].slice(0,7);}else if(ds.length){from=ds[0].slice(0,7);to=ds[ds.length-1].slice(0,7);}else return [];
  var out=[],y=+from.slice(0,4),m=+from.slice(5,7),n=0;
  while((y+'-'+('0'+m).slice(-2))<=to&&n<36){out.push(y+'-'+('0'+m).slice(-2));m++;if(m>12){m=1;y++;}n++;}
  return out;
}
var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function sdCols(months,series,vals,fmt,thin){
  var mx=0;months.forEach(function(k){var t=0;series.forEach(function(s,j){t+=vals[k][j]||0;});if(t>mx)mx=t;});
  if(mx<=0)return '<div class="small" style="padding:30px 0;text-align:center">Nothing in this period yet.</div>';
  var step=mx<=4?1:Math.pow(10,Math.floor(Math.log10(mx)));
  if(mx/step<3&&step>1)step=step/2;
  var top=Math.ceil(mx/step)*step;
  var H=210,h='<div class="sdcol">';
  for(var g=0;g*step<=top;g++){h+='<div class="gl" style="bottom:'+(g*step/top*100)+'%"><span>'+String(fmt(g*step)).replace(/^AED /,'')+'</span></div>';}
  months.forEach(function(k){var tot=0,seg='',tipp=MN[+k.slice(5,7)-1]+' '+k.slice(0,4);
    series.forEach(function(s,j){var v=vals[k][j]||0;tot+=v;if(v>0)seg+='<i style="height:'+Math.max(2,v/top*H)+'px;background:'+s.c+'"></i>';tipp+='|'+s.n+': '+fmt(v,1);});
    h+='<div class="cl" data-sdt="'+esc(tipp)+'" style="height:'+(tot/top*H)+'px">'+seg+'</div>';});
  h+='</div><div class="sdx">'+months.map(function(k,ix){return '<span>'+(thin&&months.length>8&&ix%2?'':MN[+k.slice(5,7)-1]+(months.length>12&&k.slice(5,7)==='01'?" '"+k.slice(2,4):''))+'</span>';}).join('')+'</div>';
  return h+'<div class="sdlg">'+series.map(function(s){return '<span><b style="background:'+s.c+'"></b>'+s.n+'</span>';}).join('')+'</div>';
}
function sdBars(rows,color){
  var mx=0;rows.forEach(function(r){if(r.v>mx)mx=r.v;});if(!rows.length)return '<div class="small" style="padding:18px 0">Nothing here yet.</div>';
  return '<div class="hb">'+rows.map(function(r){return '<div class="lb" title="'+esc(r.l)+'">'+(r.go||'')+esc(r.l)+(r.go?'</button>':'')+'</div><div class="tr" data-sdt="'+esc(r.tip||r.l+'|'+sdMF(r.v))+'"><i style="width:'+(mx?r.v/mx*100:0)+'%;background:'+(r.c||color||'var(--sd1)')+'"></i></div><div class="vl">'+sdM(r.v)+(r.n!=null?' <small>'+r.n+'</small>':'')+'</div>';}).join('')+'</div>';

  o.per.forEach(function(x){var k=x.date.slice(0,7);if(!ml[k])return;if(x.st==='7 - Won')ml[k][0]++;else if(x.st==='8 - Closed Lost')ml[k][1]++;});
  var fm=function(n,full){return full?sdMF(n):sdM(n);},fn=function(n){return String(Math.round(n));};

  h+='<div class="sdg"><div class="card sdc"><h3>Won revenue by month</h3><div class="sub2">Budget split into margin and creator costs</div>'+sdCols(months,ser,mv,fm)+'</div>'

  var pr=SD_STAGES.map(function(st,k){var a=o.open.filter(function(x){return x.st===st;}),v=a.reduce(function(t,x){return t+x.bud;},0);return {l:st.replace(/^\d - /,''),v:v,n:a.length+' deal'+(a.length===1?'':'s'),c:'var(--sg'+(k+1)+')',tip:st+'|'+a.length+' deal'+(a.length===1?'':'s')+' · '+sdMF(v)};});
  var hot=o.open.filter(function(x){return x.st==='5 - Verbal Agreement'||x.st==='6 - Contract Sent';}).sort(function(a,b){return b.bud-a.bud;}).slice(0,6);
  h+='<div class="sdg e"><div class="card sdc"><h3>Pipeline by stage</h3><div class="sub2">Live deals now, by value</div>'+sdBars(pr)+'<div class="row" style="justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px"><span>Total live pipeline</span><b style="font-weight:500">'+sdMF(o.ov)+' · '+o.open.length+' deal'+(o.open.length===1?'':'s')+'</b></div></div>'
    +'<div class="card sdc"><h3>Closest to signing</h3><div class="sub2">Verbal agreement and contract sent</div>'
    +(hot.length?'<table class="sdt"><thead><tr><th>Deal</th><th>Owner</th><th class="r">Value</th></tr></thead><tbody>'+hot.map(function(x){return '<tr class="clk" data-open="'+x.c.id+'"><td><b>'+esc(x.c.name)+'</b><div class="small">'+esc(x.c.client||'')+' · '+esc(x.st.replace(/^\d - /,''))+'</div></td><td>'+esc(x.owner)+'</td><td class="r">'+sdM(x.bud)+'</td></tr>';}).join('')+'</tbody></table>':'<div class="small" style="padding:18px 0">Nothing at verbal agreement or contract stage right now.</div>')+'</div></div>';
  var ow={};o.scope.forEach(function(x){ow[x.owner]=ow[x.owner]||{n:x.owner,won:0,wn:0,lost:0,open:0,cb:0,cc:0};});
  o.won.forEach(function(x){var r=ow[x.owner];r.won+=x.bud;r.wn++;if(x.costed){r.cb+=x.bud;r.cc+=x.cost;}});

/* ---------- Weekly sales report ---------- */
function wkIso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function wkMon(s){var d=new Date(s+'T00:00:00'),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return wkIso(d);}
function wkAdd(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return wkIso(d);}
function wkLong(s){var d=new Date(s+'T00:00:00');return d.getDate()+' '+['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getFullYear();}
function wkTm(n){n=String(n||'').trim();if(!n)return 'Unassigned';if(/^(liv|olivia)\b/i.test(n))return 'Liv S.';var p=n.split(/\s+/);return p.length>1?p[0]+' '+p[1][0].toUpperCase()+'.':p[0];}
function wkMk(c){var m=String(c.markets||'');if(/uae|dubai|abu dhabi|emirates/i.test(m))return 'UAE';if(/\buk\b|united kingdom|england|britain|london/i.test(m))return 'UK';return c.cur==='AED'?'UAE':'UK';}
function wkMoney(n){return cfmt('£',n);}
function wkK(n){n=Math.round(n);var a=Math.abs(n);if(a>=100000)return cfmt('£',n,Math.round(a/1000)+'k');if(a>=1000)return cfmt('£',n,(a/1000).toFixed(1).replace(/\.0$/,'')+'k');return cfmt('£',n);}
function wkCalc(mon){
  var sun=wkAdd(mon,6),end=sun>TODAY?TODAY:sun;if(end<mon)end=mon;
  var ms=end.slice(0,7)+'-01',ys=end.slice(0,4)+'-01-01',inv=[],agr=[];
  SROWS().forEach(function(c){var g=c.fx||1,tm=wkTm(c.owner),mk=wkMk(c);
    (c.invs||[]).forEach(function(i){if(i.d)inv.push({d:i.d,id:c.id,tm:tm,mk:mk,v:i.v*g,fee:(i.v-i.c)*g});});

  S.backc=null;S.backv=null;S.clientPop=null;S.sel=null;S.pick=false;

else{
