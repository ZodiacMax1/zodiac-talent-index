<style>

  --ok-bg:#1E3A2A;--ok-fg:#8FD3A8;--warn-bg:#3F3216;--warn-fg:#EBC878;--bad-bg:#4A2022;--bad-fg:#F2A7A7;--neu-bg:#30292D;--neu-fg:#CFC7CB;--bar:#34292E;--focus:#5A2A35;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}

  if(key==='recvAt'){if(z.recvAt&&k<2)z.stage='Draft received';if(!z.recvAt&&k===2)z.stage='In production';}
  if(key==='liveAt'){if(z.liveAt){z.stage='Live';if(!z.recvAt)z.recvAt=z.recv||z.liveAt;}else if(z.stage==='Live')z.stage='Approved';}}
function rcell(d){
  if(DSTAGES.indexOf(d.stage)>=2){var g=gap(d.recv,d.recvAt||d.recv);return '<div style="color:var(--ok-fg);font-weight:500">✓ Received'+((d.recvAt||d.recv)?' '+fd(d.recvAt||d.recv):'')+'</div><div class="small">'+(d.recv?'Due '+fd(d.recv)+' · '+g:'')+'</div>';}

}
function lcell(d){

  else if(t==='newt-form'){
    var nm2=document.getElementById('nt-name').value.trim();
    api(P('/talents'),{method:'POST',body:{new:{name:nm2,platform:document.getElementById('nt-plat').value,followers:Number(document.getElementById('nt-fol').value)||0,region:document.getElementById('nt-reg').value,niche:document.getElementById('nt-niche').value.trim(),rate:Number(document.getElementById('nt-rate').value)||0,mgr:document.getElementById('nt-mgr').value.trim(),email:document.getElementById('nt-email').value.trim()}}}).then(function(j){
      FULL=hydrate(j.campaign);S.pickMsg=j.note?nm2+' is already in this campaign.':nm2+' saved to the Talent Index and added to this campaign.';
      document.getElementById('newt-form').reset();render();api('/state').then(function(st){setTal(st.talents);render();});
    }).catch(function(er){toast(er.message);});
  }
});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-open],[data-tab],[data-filter],[data-pick],[data-act],[data-book],[data-dst],[data-restore],[data-ptab],[data-preg],[data-esec],[data-cur],[data-dd],[data-rml],[data-archrow],[data-dtab],[data-dfs],[data-mark],[data-unlink],[data-sqx],[data-sced],[data-scdone],[data-sdec],[data-sinc],[data-openix],[data-docview],[data-docrm],[data-docrmgo],[data-docrmno],[data-ltab],[data-gtog],[data-mdall],[data-mdtog],[data-client],[data-cpclose],[data-rmrow],[data-rmrowgo],[data-rmrowno]');if(!t)return;
  var d=t.dataset;
  if(d.go){S.backc=null;S.view=d.go;S.sel=null;S.pick=false;if(d.go==='campaigns'){S.cid=null;FULL=null;loadList().then(render);}render();}
  else if(d.client){S.clientPop=null;S.clientPage=d.client;S.view='client';S.cid=null;FULL=null;S.pick=false;S.sel=null;render();window.scrollTo(0,0);}
  else if(d.cpclose){S.clientPop=null;render();}
  else if(d.open){S.clientPop=null;S.backc=S.view==='client'?S.clientPage:null;S.view='campaign';S.cid=d.open;FULL=null;S.tab='Influencers';S.filter='All';S.dfs='All';S.dfg='All';S.sel=null;S.pick=false;S.editSec=null;render();loadOne();}
  else if(d.tab){S.tab=d.tab;S.sel=null;S.editSec=null;render();if(d.tab==='Decks & links')loadShares();}
  else if(d.rmrow){S.rmrow=d.rmrow;render();}
  else if(d.rmrowno){S.rmrow=null;render();}
  else if(d.rmrowgo){var rg=d.rmrowgo;S.rmrow=null;S.sel=null;post(P('/talents/'+rg),'DELETE',undefined,{msg:'Removed from the campaign'});}
  else if(d.sced){S.scopeEd=d.sced;S.scopeOther=null;render();}
  else if(d.scdone){S.scopeEd=null;S.scopeOther=null;render();}
  else if(d.sdec||d.sinc){var kk2=(d.sdec||d.sinc).split('|'),si2=find(kk2[0]);if(si2){var it2=si2.scope[Number(kk2[1])];it2.qty=Math.max(1,Math.min(999,it2.qty+(d.sinc?1:-1)));saveScope(si2);}}
  else if(d.sqx){var qx=d.sqx.split('|'),sx=find(qx[0]);if(sx){sx.scope=sx.scope.filter(function(z,k){return k!==Number(qx[1]);});saveScope(sx);}}
  else if(d.openix){var ox=ix(d.openix);try{window.parent.postMessage({type:'zodiac-open-talent',id:d.openix,name:ox.name},location.origin);}catch(er){}}
  else if(d.docview){openBlob('/api/campaigns/'+FULL.id+'/docs/'+d.docview);}
  else if(d.docrm){S.docrm=d.docrm;render();}
  else if(d.docrmno){S.docrm=null;render();}
  else if(d.docrmgo){S.docrm=null;post(P('/docs/'+d.docrmgo),'DELETE',undefined,{msg:'Removed'});}
  else if(d.mdall){var ms=S.mdDeals.filter(function(x){return x.status===d.mdall&&!x.imported;});ms.forEach(function(x){S.mdSel[x.id]=1;});render();}
  else if(d.mdtog){var mo=S.mdCol[d.mdtog];S.mdCol[d.mdtog]=mo===undefined?(d.mdtog==='8 - Closed Lost'):!mo;render();}
  else if(d.ltab){S.ltab=d.ltab;render();}
  else if(d.gtog){var gd=d.gtog,cur0=S.gcol[gd];S.gcol[gd]=cur0===undefined?(gd==='__arch'||gd==='s:8 - Closed Lost'):!cur0;render();}
  else if(d.unlink){post(P('/links/'+d.unlink),'DELETE',undefined,{msg:'Link removed from this campaign'});}
  else if(d.mark){var zz=cdel();var kk=d.mark==='recv'?'recvAt':'liveAt';zz[kk]=TODAY;syncStage(zz,kk);render();patchDel(zz).then(function(){render();});}
  else if(d.dfs){S.dfs=d.dfs;render();}
  else if(d.filter){S.filter=d.filter;render();}
  else if(d.pick){S.sel=d.pick;S.dd=null;S.dtab='Overview';S.addDel=false;S.editC=false;S.archiving=false;render();}
  else if(d.book){find(d.book).stage='Confirmed';render();post(P('/talents/'+d.book),'PATCH',{stage:'Confirmed'},{quiet:true});}
  else if(d.restore){var r=find(d.restore);var rb=r.archived?{archived:null}:{approved:'Yes',stage:'Confirmed'};S.sel=null;post(P('/talents/'+d.restore),'PATCH',rb,{msg:'Restored to the selected list'});}
  else if(d.dst){var z=cdel();z.stage=d.s;var k=DSTAGES.indexOf(d.s);if(k>=2){if(!z.recvAt)z.recvAt=TODAY;}else z.recvAt='';if(d.s==='Live'){if(!z.liveAt)z.liveAt=TODAY;}else z.liveAt='';render();patchDel(z).then(function(){render();});}
  else if(d.ptab){S.pickTab=d.ptab;S.pickMsg='';render();}
  else if(d.preg){S.pickReg=d.preg;S.pqFocus=false;render();}
  else if(d.archrow){S.sel=d.archrow;S.dd=null;S.editC=false;S.dtab='Details';S.archiving=true;render();}
  else if(d.dtab){S.dtab=d.dtab;render();}
  else if(d.act==='cfilerm'){post(P('/contract'),'DELETE');}
  else if(d.act==='cview'){openFile();}
  else if(d.act==='adddel'){S.addDel=!S.addDel;render();}
  else if(d.cur){post(P(''),'PATCH',{cur:d.cur},{msg:'Converted to '+d.cur+' at the saved rate'});}
  else if(d.dd){var pr=d.dd.split('|');S.dtab='Overview';S.sel=pr[0];S.dd={iid:pr[0],did:pr[1]};S.editD=false;S.editI=false;S.rmd=null;render();}
  else if(d.rml){var q=d.rml.split('|'),dd3=cdel();dd3.links=dd3.links.filter(function(l,ix2){return ix2!==Number(q[1]);});render();patchDel(dd3,{links:dd3.links});}
  else if(d.act==='ddback'){S.dd=null;render();}
  else if(d.act==='ddedit'){S.editD=!S.editD;render();}
  else if(d.act==='insedit'){S.editI=!S.editI;render();}
  else if(d.act==='rmask'){S.rmd=S.dd.did;render();}
  else if(d.act==='rmcancel'){S.rmd=null;render();}
  else if(d.act==='rmgo'){var did=S.dd.did,iid=S.dd.iid;S.dd=null;S.rmd=null;post(P('/talents/'+iid+'/deliverables/'+did),'DELETE',undefined,{msg:'Deliverable removed'});}
  else if(d.act==='addq'){S.addQ=!S.addQ;render();}
  else if(d.act==='archstart'){S.archiving=true;render();}
  else if(d.act==='rmiask'){S.rmi=S.sel;render();}
  else if(d.act==='rmicancel'){S.rmi=null;render();}
  else if(d.act==='rmigo'){var rid=S.rmi;S.rmi=null;S.sel=null;S.dd=null;post(P('/talents/'+rid),'DELETE',undefined,{msg:'Removed from the campaign'});}
  else if(d.act==='archcancel'){S.archiving=false;render();}
  else if(d.esec!==undefined){S.editSec=d.esec||null;render();}
  else if(d.act==='editc'){S.editC=!S.editC;render();}
  else if(d.act==='close'){S.rmi=null;S.sel=null;S.dd=null;S.editC=false;S.archiving=false;render();}
  else if(d.act==='pick'){S.pick=true;S.pickTab='Index';S.pickSel={};S.pickQ='';S.pickReg='All';S.pickMsg='';S.pqFocus=false;render();}
  else if(d.act==='pickclose'){S.pick=false;render();}
  else if(d.act==='pickadd'){var ids=Object.keys(S.pickSel),added=0;S.pick=false;
    ids.reduce(function(p,tid){return p.then(function(){return api(P('/talents'),{method:'POST',body:{talent_id:tid}}).then(function(j){FULL=hydrate(j.campaign);added++;});});},Promise.resolve()).then(function(){toast(added+' added from the Talent Index');render();}).catch(function(er){toast(er.message);loadOne();});}
  else if(d.act==='attall'){S.attAll=!S.attAll;render();}
  else if(d.act==='newfull'){try{window.parent.postMessage({type:'zodiac-new-talent',name:S.pickQ||''},location.origin);}catch(er){toast('Open the Talent Index and use Add Talent');}}
  else if(d.act==='carch'){S.carch=!S.carch;render();}
  else if(d.act==='crestore'){post(P(''),'PATCH',{archive:null},{msg:'Campaign restored'});}
  else if(d.act==='mrefresh'){toast('Reading monday…');api('/campaigns/refresh-monday',{method:'POST'}).then(function(j){toast('Company updated from monday on '+j.updated+' campaign'+(j.updated===1?'':'s'));return loadList();}).then(render).catch(function(er){toast(er.message);});}
  else if(d.act==='newc'){S.newc=!S.newc;render();}
  else if(d.act==='mimp'){S.mimp=!S.mimp;if(S.mimp){S.mdSel={};S.mdErr='';S.mdLoading=true;S.mdDeals=null;api('/campaigns/monday-deals').then(function(j){S.mdDeals=j.deals;S.mdLoading=false;render();}).catch(function(er){S.mdErr=er.message;S.mdLoading=false;render();});}render();}
  else if(d.act==='mimpgo'){var ids=Object.keys(S.mdSel);api('/campaigns/import-monday',{method:'POST',body:{ids:ids}}).then(function(j){S.mimp=false;toast(j.imported+' campaign'+(j.imported===1?'':'s')+' imported');return loadList();}).then(render).catch(function(er){toast(er.message);});}
});
document.addEventListener('dragover',function(e){var z=e.target.closest&&e.target.closest('#docdrop');if(z){e.preventDefault();z.classList.add('on');}});
document.addEventListener('dragleave',function(e){var z=e.target.closest&&e.target.closest('#docdrop');if(z)z.classList.remove('on');});
document.addEventListener('drop',function(e){var z=e.target.closest&&e.target.closest('#docdrop');if(z){e.preventDefault();z.classList.remove('on');addDocs(e.dataTransfer.files);}});
window.addEventListener('message',function(e){
  var m=e.data;if(e.origin!==location.origin||!m||m.type!=='zodiac-talent-created'||!FULL)return;
  api(P('/talents'),{method:'POST',body:{talent_id:m.id}}).then(function(j){FULL=hydrate(j.campaign);S.pick=false;return api('/state');})
    .then(function(st){setTal(st.talents);render();toast((m.name||'Talent')+' saved to the Talent Index and added to this campaign');}).catch(function(er){toast(er.message);});
});
function setTal(list){TAL=list.map(function(t){return {id:t.id,name:t.name,plat:platOf(t),region:t.region||'',niche:t.niche||''};});}
window.addEventListener('focus',function(){if(S.view==='campaign'&&FULL&&!S.pick)loadOne(true);else if(S.view==='campaigns')loadList().then(render);});
if(!TOKEN){document.getElementById('main').innerHTML='<div class="ld">Please sign in to the Talent Index first.</div>';}
else{
  render();
  api('/state').then(function(st){ROLE=st.role;ME=st.me;setTal(st.talents);return loadList();}).then(render).catch(function(e){LISTERR=e.message;READY=true;render();});
}
})();
</script>
</body>
</html>
