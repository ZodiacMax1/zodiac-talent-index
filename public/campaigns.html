<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campaign Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Oswald:wght@400;500;600&display=swap">
<style>
/* Layout: deep burgundy navigation rail, warm paper work area. One joined figures band, hairline tables, quiet inputs that reveal on hover, a drawer per influencer. */
:root{
  --bg:#EFECE6;--surface:#FFFFFF;--soft:#F6F3ED;--line:#E6E1D7;--line2:#D6CFC2;
  --fg:#17130F;--muted:#6F6A62;--accent:#4D0011;--accent-fg:#FFFFFF;--accent-soft:#F4E9EB;

  --ok-bg:#E4F1E8;--ok-fg:#1D6B3A;--warn-bg:#FAEFD6;--warn-fg:#7A4E00;--bad-bg:#FADFDF;--bad-fg:#9B1C1C;--neu-bg:#ECE8E0;--neu-fg:#4A4741;
  --bar:#E6E1D7;--focus:#EBD3D8;--shadow:0 1px 2px rgba(40,20,20,.04),0 8px 24px -12px rgba(40,20,20,.10);
  --display:'Oswald','Arial Narrow',sans-serif;--body:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141012;--surface:#1E181B;--soft:#261F23;--line:#34292E;--line2:#46393F;--fg:#F1EDE8;--muted:#A89FA4;
  --accent:#E9B9C3;--accent-fg:#2B0009;--accent-soft:#38202A;--side:#2A0009;--side2:#3B000D;--gold:#C9A56E;
  --ok-bg:#1E3A2A;--ok-fg:#8FD3A8;--warn-bg:#3F3216;--warn-fg:#EBC878;--bad-bg:#4A2022;--bad-fg:#F2A7A7;--neu-bg:#30292D;--neu-fg:#CFC7CB;--bar:#34292E;--focus:#5A2A35;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141012;--surface:#1E181B;--soft:#261F23;--line:#34292E;--line2:#46393F;--fg:#F1EDE8;--muted:#A89FA4;
  --accent:#E9B9C3;--accent-fg:#2B0009;--accent-soft:#38202A;--side:#2A0009;--side2:#3B000D;--gold:#C9A56E;
  --ok-bg:#1E3A2A;--ok-fg:#8FD3A8;--warn-bg:#3F3216;--warn-fg:#EBC878;--bad-bg:#4A2022;--bad-fg:#F2A7A7;--neu-bg:#30292D;--neu-fg:#CFC7CB;--bar:#34292E;--focus:#5A2A35;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{flex:0 0 236px;background:linear-gradient(180deg,var(--side2),var(--side));color:var(--side-fg);padding:26px 16px 20px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 26px}
.mark{width:38px;height:38px;border-radius:50%;border:1px solid rgba(243,239,232,.5);display:grid;place-items:center;font:500 19px var(--display);letter-spacing:.04em}
.brand b{font:400 13px/1.3 var(--display);letter-spacing:.22em;text-transform:uppercase}
.sec{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.5;padding:0 12px 6px}
.nav{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--side-fg);opacity:.78;padding:12px 12px;border-radius:8px;cursor:pointer;font-size:14.5px;position:relative}
.nav:hover{opacity:1;background:rgba(255,255,255,.07)}
.nav.on{opacity:1;background:rgba(255,255,255,.12);font-weight:500}
.nav.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.nav svg{width:18px;height:18px;flex:none}
.side .who{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(243,239,232,.16);font-size:13px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;background:rgba(243,239,232,.14);display:grid;place-items:center;font-weight:500;font-size:12px;flex:none}
.main{flex:1;min-width:0;padding:30px max(44px,env(safe-area-inset-right,0px)) 80px 44px;max-width:1500px}
.proto{display:inline-block;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:4px 11px}

.lbl{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line2)}
.sub{color:var(--muted);margin-top:6px}

.btn{white-space:nowrap;border:1px solid var(--line2);background:var(--surface);padding:9px 17px;border-radius:9px;min-height:40px;cursor:pointer;font-weight:500;transition:border-color .15s,background .15s}

.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.sm{padding:5px 12px;min-height:32px;font-size:13px}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.name:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.cell{padding:18px 22px;border-right:1px solid var(--line);min-width:0}
.cell:last-child{border-right:0}
.cell .v{font:500 32px/1.1 var(--display);margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.cell .s{font-size:13px;color:var(--muted);margin-top:2px}
.gbp{font:500 13px var(--mono);color:var(--gold);margin-top:3px}.cell.hl{background:var(--accent-soft)}.cell.hl .v{color:var(--accent)}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:20px}
.pcell{padding:16px 22px;border-right:1px solid var(--line)}.pcell:last-child{border-right:0}
.pcell .v{font:500 28px/1 var(--display);margin:6px 0 8px;font-variant-numeric:tabular-nums}
.pcell .v small{font:400 13px var(--body);color:var(--muted);margin-left:6px}
.bar{height:6px;background:var(--bar);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}.bar i.full{background:var(--ok-fg)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line2)}
.tab{border:0;background:none;padding:11px 16px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--fg)}.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.sc{overflow-x:auto}.seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--surface)}.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px}.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:500}.dl-chip{text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}.dl-chip:hover{border-color:var(--accent)}.dl-chip.k-ok{border-left:4px solid var(--ok-fg)}.dl-chip.k-bad{border-left:4px solid var(--bad-fg);background:var(--bad-bg)}.dl-chip.k-warn{border-left:4px solid var(--warn-fg)}
.dcard{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;display:grid;gap:8px;box-shadow:var(--shadow)}.dcard:hover{border-color:var(--accent)}.dcard.k-ok{border-left-color:var(--ok-fg)}.dcard.k-bad{border-left-color:var(--bad-fg)}.dcard.k-warn{border-left-color:var(--warn-fg)}
.mini{display:flex;gap:3px}.mini b{flex:1;height:4px;border-radius:4px;background:var(--line2)}.mini b.d{background:var(--ok-fg)}.mini b.x{background:var(--bad-fg)}.mini b.w{background:var(--warn-fg)}.mini b.c{background:var(--accent)}
.mc{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);border-radius:8px;padding:4px 9px;background:var(--neu-bg);color:var(--neu-fg);white-space:nowrap}.mc i{font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}.mc.k-ok{background:var(--ok-bg);color:var(--ok-fg)}.mc.k-bad{background:var(--bad-bg);color:var(--bad-fg)}.mc.k-warn{background:var(--warn-bg);color:var(--warn-fg)}
.trk{display:flex;align-items:flex-start;padding:4px 0}.tn{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;cursor:pointer;width:54px;padding:0}.tn .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font:500 11px var(--mono);color:var(--muted);background:var(--surface)}.tn.d .dot{background:var(--ok-fg);border-color:var(--ok-fg);color:var(--surface)}.tn.c .dot{border-color:var(--accent);background:var(--accent);color:var(--accent-fg);box-shadow:0 0 0 4px var(--accent-soft)}.tn .tl{font-size:11px;text-align:center;line-height:1.2;color:var(--muted)}.tn.c .tl{color:var(--accent);font-weight:500}.tn.d .tl{color:var(--ok-fg)}.tn .ts{font:500 10px var(--mono);color:var(--muted);min-height:12px}.tc{flex:1;height:2px;background:var(--line2);margin-top:13px;min-width:4px}.tc.d{background:var(--ok-fg)}
.msg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.ms{border:1px solid var(--line);border-top:4px solid var(--line2);border-radius:12px;padding:14px 16px;background:var(--soft)}.ms .big{font:500 22px var(--display);letter-spacing:.02em;margin-top:6px}.ms .sb{font-size:13px;color:var(--muted);margin-top:2px}.ms.k-ok{border-top-color:var(--ok-fg);background:var(--ok-bg)}.ms.k-ok .big{color:var(--ok-fg)}.ms.k-bad{border-top-color:var(--bad-fg);background:var(--bad-bg)}.ms.k-bad .big,.ms.k-bad .sb{color:var(--bad-fg)}.ms.k-warn{border-top-color:var(--warn-fg);background:var(--warn-bg)}.ms.k-warn .big,.ms.k-warn .sb{color:var(--warn-fg)}
.drawer h2.sh{font:500 11px var(--mono);letter-spacing:.18em;color:var(--muted)}
.fb.bad{color:var(--bad-fg)}.fb.on.bad{color:var(--accent-fg)}.dfs{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2)}.dfs label{display:grid;grid-template-columns:58px minmax(0,1fr);align-items:center;gap:8px}.dt{min-width:0;font:500 12px var(--mono);border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:6px 8px;min-height:34px;width:100%;color-scheme:light dark}.dt:hover{border-color:var(--accent)}.dt:focus{outline:2px solid var(--accent);outline-offset:1px}
.dlrow{display:flex;gap:10px;flex-wrap:wrap}.dlc{width:178px;text-align:left;background:var(--soft);border:1px solid var(--line);border-top:4px solid var(--line2);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}.dlc:hover{border-color:var(--accent)}.dlc .nm{font-size:14px;font-weight:500}.dlc .when{font-size:12.5px;color:var(--muted);margin-top:4px}.dlc .st{font-size:13px;font-weight:500;margin-top:2px}
.dlc.k-bad{border-top-color:var(--bad-fg);background:var(--bad-bg)}.dlc.k-bad .st{color:var(--bad-fg)}.dlc.k-warn{border-top-color:var(--warn-fg);background:var(--warn-bg)}.dlc.k-warn .st{color:var(--warn-fg)}.dlc.k-neu .st{color:var(--muted)}.dlc.k-ok{border-top-color:var(--ok-fg)}
.hero{background:linear-gradient(135deg,#3B000D,#5A0A1C);color:#F3EFE8;border-radius:16px;padding:24px 28px;margin-bottom:16px;display:grid;gap:18px}.hero h3{margin:0;font:500 26px var(--display);letter-spacing:.03em;text-transform:uppercase}.hero .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.hero .t{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px}.hero .t .l{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#D9C9A8}.hero .t .v{font-size:17px;margin-top:3px}
.sgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}@media(max-width:1100px){.sgrid{grid-template-columns:1fr}}
.cst{display:flex;align-items:center;margin:2px 0 18px}.cst .p{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.cst .p i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}.cst .p.d{color:var(--ok-fg)}.cst .p.d i{background:var(--ok-fg);border-color:var(--ok-fg);color:var(--surface)}.cst .p.c{color:var(--accent);font-weight:500}.cst .p.c i{border-color:var(--accent)}.cst .ln{flex:1;height:2px;background:var(--line2);margin:0 10px;min-width:20px}.cst .ln.d{background:var(--ok-fg)}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.terms .t{background:var(--soft);border-radius:10px;padding:10px 14px}.terms .t .l{font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.terms .t .v{margin-top:3px}
.dz{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1.5px dashed var(--line2);border-radius:14px;padding:26px 18px;cursor:pointer;color:var(--muted);background:var(--soft);transition:.15s}.dz:hover,.dz.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.dz .ic{font-size:26px}
.file{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--soft)}.file .ft{width:44px;height:52px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font:500 11px var(--mono);letter-spacing:.08em}.file .fn{font-weight:500;word-break:break-all}
.cav{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font:500 15px var(--display)}.thread{display:flex;flex-direction:column;gap:10px}.cm{display:flex;gap:10px}.cm .av2{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 11px var(--body);flex:none}.cm .bd{background:var(--soft);border-radius:4px 12px 12px 12px;padding:9px 13px;font-size:14px;flex:1}.cm .meta{font-size:12px;color:var(--muted);margin-bottom:2px}.lkx{color:var(--accent);font-weight:500;font-size:13px;text-decoration:none}.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line2);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--muted)}.drop:hover{border-color:var(--accent);color:var(--accent)}.shot{max-width:100%;max-height:180px;border-radius:10px;border:1px solid var(--line)}.dtabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-top:-6px}.dtabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}.dtabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}.lk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}.lk a{color:var(--accent);font-weight:500;text-decoration:none}.lk a:hover{text-decoration:underline}.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}.x:hover{color:var(--bad-fg)}.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.met{background:var(--soft);border-radius:10px;padding:10px 12px}.met .v{font:500 22px var(--display);font-variant-numeric:tabular-nums}.met input{width:100%}
table{border-collapse:collapse;width:100%}

td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--soft)}
.r{text-align:right}.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:500;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok-fg)}.warn{background:var(--warn-bg);color:var(--warn-fg)}.bad{background:var(--bad-bg);color:var(--bad-fg)}.neu{background:var(--neu-bg);color:var(--neu-fg)}.brand-p{background:var(--accent-soft);color:var(--accent)}
.who2{display:flex;align-items:center;gap:12px}
.ini{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:500 13px var(--display);letter-spacing:.04em;flex:none}
.name{white-space:nowrap;background:none;border:0;padding:0;font-weight:500;cursor:pointer;text-align:left;color:var(--fg)}
.name:hover{color:var(--accent)}
.idx{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-left:8px}
.small{font-size:13px;color:var(--muted)}
.in{width:116px;text-align:right;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 9px;font:14px var(--mono);font-variant-numeric:tabular-nums}
.in{cursor:text}.in:hover{border-color:var(--line2);background:var(--surface)}
.in.pc{width:68px}
.in:focus{border:1px solid var(--accent);background:var(--surface);outline:3px solid var(--focus)}

}

<body>
<div class="app">
  
  <main class="main" id="main"></main>
</div>
<div id="layer"></div><div id="toast"></div>
<script>
(function(){
var STAGES=['Shortlisted','Outreach','Negotiating','Confirmed'];
var APPROVED=['Yes','Maybe','Not yet','Declined'];
var CONTRACT=['–','Sent','Signed'];
var CONTENT=['–','In production','Received','Feedback','Approved'];
var INVOICE=['Not invoiced','Invoiced','Part paid','Paid'];
var DSTAGES=['Brief sent','In production','Draft received','Feedback','Approved','Live'];
var MONDAY=['3 - Proposal Sent','4 - Negotiation','5 - Verbal Agreement','6 - Contract Sent','7 - Won'];
var CSTATUS=['Not started','Sent to client','Signed'];
var TERMS=['Upfront','Net 30','Net 45','Net 60'];
var TODAY='2027-03-06';var SYM={GBP:'£',USD:'$',AED:''};var FXD={GBP:1,USD:0.75,AED:0.2};var REASONS=['Dropped out','Client request','Budget','Contract issue','Availability','Other'];
function calc(b,m){return b/(1-m/100);}
var TAL=[],CAMPS=[],FULL=null,ROLE='view',ME=null,READY=false,TOKEN=null,LISTERR='';
try{TOKEN=localStorage.getItem('zodiacTalentToken_v2');}catch(e){}
function canEdit(){return ROLE==='edit';}
function api(path,opts){
  opts=opts||{};var h={'content-type':'application/json'};if(TOKEN)h.authorization='Bearer '+TOKEN;
  return fetch('/api'+path,{method:opts.method||'GET',headers:h,body:opts.body!==undefined?JSON.stringify(opts.body):undefined}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      if(r.status===401){try{parent.postMessage('zodiac-locked','*');}catch(e){}throw new Error('Please sign in again');}
      if(!r.ok)throw new Error(j.error||'Something went wrong');return j;});});
}
function fmtFolT(n){return n>=1e6?(n/1e6).toFixed(n%1e6===0?0:1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(n);}
function platOf(t){var o=[];if(t.ig_followers)o.push('IG '+fmtFolT(t.ig_followers));if(t.tt_followers)o.push('TT '+fmtFolT(t.tt_followers));if(t.yt_followers)o.push('YT '+fmtFolT(t.yt_followers));return o.join(' · ');}
function ix(t){var f=FULL&&FULL.infl.filter(function(i){return i.tid===t;})[0];if(f)return f;return TAL.filter(function(x){return x.id===t;})[0]||{name:'Unknown',plat:'',region:'',niche:'',mgr:'',email:'',phone:''};}
function sub(t){var x=ix(t);return (x.plat||'')+(x.plat&&x.region?' · ':'')+(x.region||'');}
var _n=new Date();function p2(n){return (n<10?'0':'')+n;}
var TODAY=_n.getFullYear()+'-'+p2(_n.getMonth()+1)+'-'+p2(_n.getDate());
var SYM={GBP:'£',USD:'$',AED:''};var FXD={GBP:1,USD:0.75,AED:0.2};var REASONS=['Dropped out','Client request','Budget','Contract issue','Availability','Other'];
function fdy(iso){if(!iso)return '';return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function fts(iso){if(!iso)return '';var d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fsize(n){n=Number(n)||0;return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
function hydrate(c){
  c.dates=c.start&&c.end?fd(c.start)+' – '+fdy(c.end):c.start?'From '+fdy(c.start):c.end?'Until '+fdy(c.end):'Dates TBC';
  (c.infl||[]).forEach(function(i){i.comments.forEach(function(m){m.at=fts(m.at);});i.quotes.forEach(function(q){q.d=fd(String(q.d).slice(0,10));});if(i.archived&&i.archived.date&&/^\d{4}/.test(i.archived.date))i.archived.date=fd(i.archived.date);});
  return c;
}
var CUR=null;
var S={tick:0,dfs:'All',dfg:'All',view:'campaigns',cid:null,tab:'Influencers',filter:'All',sel:null,adding:false,newc:false,pick:false,pickTab:'Index',pickSel:{},pickQ:'',pickReg:'All',pickMsg:'',editC:false,editSec:null,dd:null,dtab:'Overview',addDel:false,editD:false,editI:false,rmd:null,archiving:false};
function camp(){return FULL&&FULL.id===S.cid?FULL:null;}
function won(c){return c.stage==='7 - Won';}
function base(i){return i.neg||i.initial;}
function moneyIn(n,c){var cur=(c&&c.cur)||'GBP';var t=Math.abs(Math.round(n)).toLocaleString('en-GB');return (n<0?'-':'')+(cur==='AED'?t+' AED':SYM[cur]+t);}
function money(n){return moneyIn(n,CUR);}
function gbpIn(n,c){return '£'+Math.round(n*c.fx).toLocaleString('en-GB');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function initials(n){return n.split(/\s+/).map(function(p){return p.charAt(0);}).join('').slice(0,2).toUpperCase();}
function cls(v){
  if(['Yes','Confirmed','Signed','Approved','Live','Paid'].indexOf(v)>-1)return 'ok';
  if(['Maybe','Negotiating','Sent','Sent to client','In production','Invoiced','Part paid','Received','Draft received'].indexOf(v)>-1)return 'warn';
  if(['Declined','Feedback'].indexOf(v)>-1)return 'bad';
  if(['Outreach'].indexOf(v)>-1)return 'brand-p';
  return 'neu';
}
function sel(field,val,opts,iid,attr){
  return '<select class="sel '+cls(val)+'" data-f="'+field+'" data-i="'+iid+'" aria-label="'+field+'">'+opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
}
function selected(c){return c.infl.filter(function(i){return i.approved==='Yes'&&!i.archived;});}
function fd(iso){if(!iso)return '–';var d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function dinfo(d){
  var done=d.stage==='Live';
  if(d.stage==='Approved'&&d.live){var df=Math.round((new Date(d.live)-new Date(TODAY))/864e5);return {k:df<0?'bad':'warn',t:df<0?(-df)+(df===-1?' day':' days')+' late to post':'Approved · not posted',key:d.live,w:'Go live',date:d.live,diff:df};}
  if(done)return {k:'ok',t:'Done',done:true,key:d.live||d.recv||'9',w:'Went live',date:d.live};
  var early=DSTAGES.indexOf(d.stage)<=1,ds=early?d.recv:d.live,w=early?'Receive by':'Go live';
  if(!ds)return {k:'neu',t:'No date',key:'9',w:w,date:''};
  var diff=Math.round((new Date(ds)-new Date(TODAY))/864e5);
  if(diff<0)return {k:'bad',t:(-diff)+(diff===-1?' day overdue':' days overdue'),key:ds,w:w,date:ds,diff:diff};
  if(diff===0)return {k:'warn',t:'Due today',key:ds,w:w,date:ds,diff:0};
  if(diff<=3)return {k:'warn',t:'Due in '+diff+(diff===1?' day':' days'),key:ds,w:w,date:ds,diff:diff};
  return {k:'neu',t:'In '+diff+' days',key:ds,w:w,date:ds,diff:diff};
}
function gap(due,act){if(!due||!act)return '';var n=Math.round((new Date(act)-new Date(due))/864e5);return n===0?'on time':n<0?(-n)+(n===-1?' day early':' days early'):n+(n===1?' day late':' days late');}
function mst(d,kind){
  var isR=kind==='recv',dl=isR?d.recv:d.live,done=isR?DSTAGES.indexOf(d.stage)>=2:d.stage==='Live',at=isR?(d.recvAt||d.recv):(d.liveAt||d.live);
  if(done)return {k:'ok',big:(isR?'Received ':'Posted ')+(at?fd(at):''),sub:dl?'Deadline '+fd(dl)+' · '+gap(dl,at):'No deadline set',state:'Complete'};
  if(!isR&&d.stage==='Approved'&&dl){var dd=Math.round((new Date(dl)-new Date(TODAY))/864e5);return {k:dd<0?'bad':'warn',big:'Due '+fd(dl),sub:dd<0?(-dd)+(dd===-1?' day':' days')+' overdue. Approved, not posted':'Approved, not posted',state:dd<0?'Overdue':'Needs posting'};}
  if(!dl)return {k:'neu',big:'No deadline',sub:'Add one with Edit',state:'Not set'};
  var diff=Math.round((new Date(dl)-new Date(TODAY))/864e5);
  if(diff<0)return {k:'bad',big:'Due '+fd(dl),sub:(-diff)+(diff===-1?' day':' days')+' overdue',state:'Overdue'};
  if(diff<=3)return {k:'warn',big:'Due '+fd(dl),sub:diff===0?'Due today':'In '+diff+(diff===1?' day':' days'),state:'Due soon'};
  return {k:'neu',big:'Due '+fd(dl),sub:'In '+diff+' days',state:'Upcoming'};
}
function mchip(d,kind){var m=mst(d,kind);var lab=kind==='recv'?'Content':'Post';var v=m.k==='ok'?'✓ '+m.big.replace(/^(Received|Posted) /,''):m.k==='neu'&&m.state==='Not set'?'–':m.big.replace('Due ','');return '<span class="mc k-'+m.k+'"><i>'+lab+'</i>'+v+(m.k==='bad'?' · late':'')+'</span>';}
function mini(d){var k=DSTAGES.indexOf(d.stage);return '<span class="mini">'+DSTAGES.map(function(x,j){return '<b class="'+(j<k||k===5?'d':j===k?'c':'')+'"></b>';}).join('')+'</span>';}
function syncStage(z,key){var k=DSTAGES.indexOf(z.stage);
  if(key==='recvAt'){if(z.recvAt&&k<2)z.stage='Draft received';if(!z.recvAt&&k===2)z.stage='In production';}
  if(key==='liveAt'){if(z.liveAt){z.stage='Live';if(!z.recvAt)z.recvAt=z.recv||z.liveAt;}else if(z.stage==='Live')z.stage='Approved';}}
function rcell(d){
  if(DSTAGES.indexOf(d.stage)>=2){var g=gap(d.recv,d.recvAt||d.recv);return '<div style="color:var(--ok-fg);font-weight:500">✓ Received'+((d.recvAt||d.recv)?' '+fd(d.recvAt||d.recv):'')+'</div><div class="small">'+(d.recv?'Due '+fd(d.recv)+' · '+g:'')+'</div>';}
  if(!d.recv)return '<span class="small">No deadline</span>';
  var late=d.recv<TODAY;return '<div style="'+(late?'color:var(--bad-fg);':'')+'font-weight:500">Due '+fd(d.recv)+'</div><div class="small">Not received yet</div>';
}
function lcell(d){
  if(d.stage==='Live'){var g=gap(d.live,d.liveAt||d.live);return '<div style="color:var(--ok-fg);font-weight:500">✓ Posted '+fd(d.liveAt||d.live)+'</div><div class="small">'+(d.live?'Due '+fd(d.live)+' · '+g:'')+'</div>';}
  if(!d.live)return '<span class="small">No date</span>';
  var late=d.live<TODAY;return '<div style="'+(late?'color:var(--bad-fg);':'')+'font-weight:500">Due '+fd(d.live)+'</div><div class="small">'+(d.stage==='Approved'?'Approved, not posted yet':'Not posted yet')+'</div>';
}
function dstate(d){var n=dinfo(d);return n.k==='bad'?'Overdue':n.k==='warn'?'Due soon':'';}
function dchip(d){var n=dinfo(d);if(n.k==='neu')return '';return '<span class="pill '+n.k+'">'+(n.done?'✓ Done':n.t)+'</span>';}
function stats(c){
  var ap=selected(c),cost=0,price=0;ap.forEach(function(i){cost+=base(i);price+=i.client;});
  var m=price-cost;return {cost:cost,price:price,m:m,pc:price>0?m/price*100:0,n:ap.length};
}
function pct(a,b){return b?Math.round(a/b*100):0;}
function dsum(i){var t=i.deliv.length;if(!t)return '<span class="small">None yet</span>';var live=i.deliv.filter(function(d){return d.stage==='Live';}).length,od=i.deliv.filter(function(d){return dinfo(d).k==='bad';}).length,np=i.deliv.filter(function(d){return d.stage==='Approved';}).length;
  return '<div style="display:grid;gap:5px;min-width:130px"><div style="font-size:13px"><b style="font-weight:500">'+live+' of '+t+'</b> posted</div><div class="mini">'+i.deliv.map(function(d){var k=dinfo(d).k;return '<b class="'+(d.stage==='Live'?'d':k==='bad'?'x':k==='warn'?'w':'')+'"></b>';}).join('')+'</div>'+(od?'<div style="font-size:12px;color:var(--bad-fg)">'+od+' overdue</div>':np?'<div style="font-size:12px;color:var(--warn-fg)">'+np+' to post</div>':'')+'</div>';}
function progress(c){
  var s=selected(c),n=s.length,dels=[];s.forEach(function(i){i.deliv.forEach(function(d){dels.push(d);});});
  var live=dels.filter(function(d){return d.stage==='Live';}).length;
  var signed=s.filter(function(i){return i.contract==='Signed';}).length;
  var appr=dels.filter(function(d){return d.stage==='Approved'||d.stage==='Live';}).length;
  var inv=s.filter(function(i){return i.invoice!=='Not invoiced';}).length;
  var paid=s.filter(function(i){return i.invoice==='Paid';}).length;
  return [['Deliverables complete',live,dels.length],['Contracts signed',signed,n],['Content approved',appr,dels.length],['Invoiced',inv,n],['Paid',paid,n]];
}
function prog(c){
  return '<div class="prog">'+progress(c).map(function(p){var v=pct(p[1],p[2]);return '<div class="pcell"><div class="lbl">'+p[0]+'</div><div class="v">'+v+'%<small>'+p[1]+' of '+p[2]+'</small></div><div class="bar"><i class="'+(v===100?'full':'')+'" style="width:'+v+'%"></i></div></div>';}).join('')+'</div>';
}
function cellS(l,v,s,hl,g){return '<div class="cell'+(hl?' hl':'')+'"><div class="lbl">'+l+'</div><div class="v">'+v+'</div>'+(g?'<div class="gbp">≈ '+g+'</div>':'')+'<div class="s">'+s+'</div></div>';}
function toast(m){var t=document.getElementById('toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(function(){t.innerHTML='';},2600);}

function mondayImport(){
  var h='<div class="card" style="padding:18px;margin-bottom:16px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 class="sh" style="margin:0">Proposal Sent on monday</h2><button class="btn sm" data-act="mimp">Close</button></div>';
  if(S.mdLoading)return h+'<div class="ld">Reading monday…</div></div>';
  if(S.mdErr)return h+'<div class="ro">'+esc(S.mdErr)+'</div></div>';
  var L=S.mdDeals||[];if(!L.length)return h+'<div class="small">Nothing at Proposal Sent on the Agency Sales Pipeline right now.</div></div>';
  var n=Object.keys(S.mdSel||{}).length;
  h+='<div class="small" style="margin-bottom:10px">Agency Sales Pipeline deals at 3 - Proposal Sent, latest start date first. Tick the ones you want as campaigns. Budget, currency, target margin and start date come from monday.</div><table><thead><tr><th></th><th>Deal</th><th>Client</th><th>Starts</th><th class="r">Budget</th><th>Owner</th></tr></thead><tbody>';
  L.forEach(function(d){h+='<tr><td><input type="checkbox" data-mdsel="'+d.id+'"'+(d.imported?' disabled checked':(S.mdSel[d.id]?' checked':''))+'></td><td><b>'+esc(d.name)+'</b></td><td>'+esc(d.client||'–')+'</td><td>'+esc(d.start||'–')+'</td><td class="r num">'+(d.value?d.value.toLocaleString('en-GB')+' '+esc(d.cur||''):'–')+'</td><td>'+esc(d.owner||'–')+(d.imported?' <span class="small">· already here</span>':'')+'</td></tr>';});
  return h+'</tbody></table><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" data-act="mimpgo"'+(n?'':' disabled')+'>Import '+(n?n+' ':'')+'as campaigns</button></div></div>';
}
function viewCampaigns(){
  var h='<div class="top"><div><h1>Campaigns</h1><div class="sub">One row per project. Stage comes from monday; influencers, rates and margin live here.</div></div>'+(canEdit()?'<div class="row"><button class="btn" data-act="mimp">Import from monday</button><button class="btn pri" data-act="newc">+ New campaign</button></div>':'')+'</div>';
  if(S.mimp)h+=mondayImport();
  if(!canEdit())h+='<div class="ro">View-only access. You can look around but not change anything.</div>';
  if(S.newc)h+='<form class="add card" id="newc-form" style="margin-bottom:16px"><input class="fld" style="flex:2;min-width:160px" id="nc-name" placeholder="Campaign name" required><input class="fld" style="flex:2;min-width:160px" id="nc-client" placeholder="Client / brand" required><select class="sel plain" id="nc-cur" style="width:auto"><option value="GBP">£ GBP</option><option value="USD">$ USD</option><option value="AED">AED</option></select><input class="fld" style="flex:1;min-width:140px" id="nc-budget" type="number" min="0" placeholder="Client budget" required><button class="btn pri" type="submit">Create</button><button class="btn" type="button" data-act="newc">Cancel</button></form>';
  if(LISTERR)return h+'<div class="ro">'+esc(LISTERR)+'</div>';
  if(!READY)return h+'<div class="ld">Loading campaigns…</div>';
  if(!CAMPS.length)return h+'<div class="card" style="padding:28px">No campaigns yet. Create one to start tracking influencers, rates and margin.</div>';
  h+='<div class="card sc"><table><thead><tr><th>Campaign</th><th>monday stage</th><th class="r">Budget</th><th class="r">Creator costs</th><th class="r">Margin</th><th class="r">Margin %</th><th>Selected</th><th>Owner</th></tr></thead><tbody>';
  CAMPS.forEach(function(c){
    var s={cost:c.cost,price:c.price,m:c.margin,pc:c.price>0?c.margin/c.price*100:0,n:c.selected};
    h+='<tr class="clk" data-open="'+c.id+'"><td><div class="who2"><div class="ini">'+initials(c.name)+'</div><div><b>'+esc(c.name)+'</b><div class="small">'+esc(c.client)+'</div></div></div></td><td><span class="pill '+(won(c)?'ok':'warn')+'">'+esc(c.stage)+'</span></td><td class="r num">'+moneyIn(c.budget,c)+(c.cur!=='GBP'?'<div class="small">'+gbpIn(c.budget,c)+'</div>':'')+'</td><td class="r num">'+moneyIn(s.cost,c)+(c.cur!=='GBP'?'<div class="small">'+gbpIn(s.cost,c)+'</div>':'')+'</td><td class="r num"><b>'+moneyIn(s.m,c)+'</b>'+(c.cur!=='GBP'?'<div class="small">'+gbpIn(s.m,c)+'</div>':'')+'</td><td class="r num"><b>'+(s.price?s.pc.toFixed(1)+'%':'–')+'</b>'+(s.price&&s.pc<c.target?'<div class="small" style="color:var(--bad-fg)">below target</div>':'')+'</td><td>'+s.n+' of '+c.total+'</td><td>'+esc(c.owner)+'</td></tr>';
  });
  return h+'</tbody></table></div><div class="note">Creator costs, margin and margin % count selected (approved) influencers only. Margin = client price − creator costs. Margin % = margin ÷ client price.</div>';
}
function deadlines(c){
  var items=[],dn=0,tot=0;
  selected(c).forEach(function(i){i.deliv.forEach(function(d){tot++;if(d.stage==='Live')dn++;
    ['recv','live'].forEach(function(kd){var m=mst(d,kd);if(m.k==='ok'||m.state==='Not set')return;items.push({i:i,d:d,m:m,kd:kd,key:(kd==='recv'?d.recv:d.live)});});});});

function apply(el){

}

  if(t.id==='dfg'){S.dfg=t.value;render();return;}
  if(t.id==='lshare'){if(t.value)post(P('/links'),'POST',{code:t.value},{msg:'Link added to this campaign'});return;}
  if(t.id==='mstage'){post(P(''),'PATCH',{stage:t.value});return;}
  if(t.id==='shotfile'){var fl=t.files&&t.files[0];if(fl){
    if(fl.size>4*1024*1024){toast('That screenshot is over 4MB');return;}
    toast('Reading the screenshot…');
    b64(fl).then(function(data){return api('/campaigns/read-insights',{method:'POST',body:{type:fl.type,data:data}});}).then(function(j){
      var dd=cdel(),got=0;Object.keys(j.insights).forEach(function(k){if(j.insights[k]!=null){dd.ins[k]=j.insights[k];got++;}});
      S.editI=true;render();
      if(!got){toast('No numbers found. Enter them by hand.');return;}
      toast('Read '+got+' figure'+(got===1?'':'s')+'. Check them against the screenshot.');
      patchDel(dd,{ins:dd.ins});
    }).catch(function(er){toast(er.message);});}return;}
  if(t.id==='cfile'){if(t.files&&t.files[0])attach(t.files[0]);return;}
  if(d.ps){if(t.checked)S.pickSel[d.ps]=1;else delete S.pickSel[d.ps];render();return;}
  if(d.ix){var body={};body[d.k]=t.value;FULL.infl.forEach(function(i){if(i.tid===d.ix)i[d.k]=t.value;});
    api('/campaigns/talent-contact/'+d.ix,{method:'PATCH',body:body}).then(function(){toast('Saved to the Talent Index profile');}).catch(function(er){toast(er.message);});return;}
  if(d.cf){var c=camp(),k=d.cf,v=t.value;if(['budget','cValue','target','fx'].indexOf(k)>-1){v=Number(v);if(!isFinite(v)||v<0){render();return;}}
    var body2={};body2[k]=v;c[k]=v;post(P(''),'PATCH',body2,{quiet:!RERENDER[k]});return;}
  if(d.dk){var ii=find(S.dd.iid);ii.deliv.forEach(function(z){if(z.id===S.dd.did){z[d.dk]=t.value;syncStage(z,d.dk);render();patchDel(z).then(function(){render();});}});return;}
  if(d.dm){var z3=cdel();var o={};Object.keys(z3.ins).forEach(function(k){o[k]=z3.ins[k];});var n3=parseFloat(String(t.value).replace(/,/g,''));o[d.dm]=isFinite(n3)?n3:'';z3.ins=o;patchDel(z3,{ins:o});return;}
  if(d.f)apply(t);
});
document.addEventListener('input',function(e){if(e.target.id==='pq'){S.pickQ=e.target.value;S.pqFocus=true;render();}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList.contains('in'))e.target.blur();if(e.key==='Escape'&&(S.sel||S.pick)){S.sel=null;S.dd=null;S.pick=false;render();}});
document.addEventListener('submit',function(e){
  e.preventDefault();var c=camp(),t=e.target.id;
  if(t==='newc-form'){
    api('/campaigns',{method:'POST',body:{name:document.getElementById('nc-name').value.trim(),client:document.getElementById('nc-client').value.trim(),cur:document.getElementById('nc-cur').value,budget:Number(document.getElementById('nc-budget').value)||0,owner:ME&&ME.name||''}}).then(function(j){
      FULL=hydrate(j.campaign);S.newc=false;S.cid=FULL.id;S.view='campaign';S.tab='Influencers';S.filter='All';render();loadList();
    }).catch(function(er){toast(er.message);});
  }
  else if(t==='quote-form'){var amt=document.getElementById('q-amt').value.trim();S.addQ=false;post(P('/talents/'+S.sel+'/quotes'),'POST',{amount:amt});}
  else if(t==='tc-form'){var g=document.getElementById('tc-g'),lk=document.getElementById('tc-l').value.trim();post(P('/talents/'+S.sel+'/comments'),'POST',{body:document.getElementById('tc-t').value.trim(),tag:g?g.value:'',link:lk});}
  else if(t==='dnew-form'){S.addDel=false;post(P('/talents/'+S.sel+'/deliverables'),'POST',{name:document.getElementById('d-name').value.trim(),platform:document.getElementById('d-plat').value,recv:document.getElementById('d-recv').value,live:document.getElementById('d-live').value});}
  else if(t==='arch-form'){var ai=find(S.sel),nm=ai.name;var rs=document.getElementById('ar-reason').value,nt=document.getElementById('ar-note').value.trim();S.archiving=false;var sid=S.sel;S.sel=null;S.dd=null;post(P('/talents/'+sid),'PATCH',{archived:{reason:rs,note:nt}},{msg:nm+' archived. Moved to the Archive tab.'});}
  else if(e.target.dataset&&e.target.dataset.lk){var dd=cdel(),f=e.target;var item={l:f.elements.l.value.trim(),u:f.elements.u.value.trim()};if(!/^https?:\/\//i.test(item.u)){toast('The link has to start with https://');return;}dd.links=dd.links.concat([item]);render();patchDel(dd,{links:dd.links});}
  else if(t==='newt-form'){
    var nm2=document.getElementById('nt-name').value.trim();
    api(P('/talents'),{method:'POST',body:{new:{name:nm2,platform:document.getElementById('nt-plat').value,followers:Number(document.getElementById('nt-fol').value)||0,region:document.getElementById('nt-reg').value,niche:document.getElementById('nt-niche').value.trim(),rate:Number(document.getElementById('nt-rate').value)||0,mgr:document.getElementById('nt-mgr').value.trim(),email:document.getElementById('nt-email').value.trim()}}}).then(function(j){
      FULL=hydrate(j.campaign);S.pickMsg=j.note?nm2+' is already in this campaign.':nm2+' saved to the Talent Index and added to this campaign.';
      document.getElementById('newt-form').reset();render();api('/state').then(function(st){setTal(st.talents);render();});
    }).catch(function(er){toast(er.message);});
  }
});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-open],[data-tab],[data-filter],[data-pick],[data-act],[data-book],[data-dst],[data-restore],[data-ptab],[data-preg],[data-esec],[data-cur],[data-dd],[data-rml],[data-archrow],[data-dtab],[data-dfs],[data-mark],[data-unlink]');if(!t)return;
  var d=t.dataset;
  if(d.go){S.view=d.go;S.sel=null;S.pick=false;if(d.go==='campaigns'){S.cid=null;FULL=null;loadList().then(render);}render();}
  else if(d.open){S.view='campaign';S.cid=d.open;FULL=null;S.tab='Influencers';S.filter='All';S.dfs='All';S.dfg='All';S.sel=null;S.pick=false;S.editSec=null;render();loadOne();}
  else if(d.tab){S.tab=d.tab;S.sel=null;S.editSec=null;render();if(d.tab==='Decks & links')loadShares();}
  else if(d.unlink){post(P('/links/'+d.unlink),'DELETE',undefined,{msg:'Link removed from this campaign'});}
  else if(d.mark){var zz=cdel();var kk=d.mark==='recv'?'recvAt':'liveAt';zz[kk]=TODAY;syncStage(zz,kk);render();patchDel(zz).then(function(){render();});}
  else if(d.dfs){S.dfs=d.dfs;render();}
  else if(d.filter){S.filter=d.filter;render();}
  else if(d.pick){S.sel=d.pick;S.dd=null;S.dtab='Overview';S.addDel=false;S.editC=false;S.archiving=false;render();}
  else if(d.book){find(d.book).stage='Confirmed';render();post(P('/talents/'+d.book),'PATCH',{stage:'Confirmed'},{quiet:true});}
  else if(d.restore){var r=find(d.restore);var rb=r.archived?{archived:null}:{approved:'Yes',stage:'Confirmed'};S.sel=null;post(P('/talents/'+d.restore),'PATCH',rb,{msg:'Restored to the selected list'});}
  else if(d.dst){var z=cdel();z.stage=d.s;var k=DSTAGES.indexOf(d.s);if(k>=2){if(!z.recvAt)z.recvAt=TODAY;}else z.recvAt='';if(d.s==='Live'){if(!z.liveAt)z.liveAt=TODAY;}else z.liveAt='';render();patchDel(z).then(function(){render();});}
  else if(d.ptab){S.pickTab=d.ptab;S.pickMsg='';render();}
  else if(d.preg){S.pickReg=d.preg;S.pqFocus=false;render();}
  else if(d.archrow){S.sel=d.archrow;S.dd=null;S.editC=false;S.dtab='Details';S.archiving=true;render();}
  else if(d.dtab){S.dtab=d.dtab;render();}
  else if(d.act==='cfilerm'){post(P('/contract'),'DELETE');}
  else if(d.act==='cview'){openFile();}
  else if(d.act==='adddel'){S.addDel=!S.addDel;render();}
  else if(d.cur){post(P(''),'PATCH',{cur:d.cur},{msg:'Converted to '+d.cur+' at the saved rate'});}
  else if(d.dd){var pr=d.dd.split('|');S.dtab='Overview';S.sel=pr[0];S.dd={iid:pr[0],did:pr[1]};S.editD=false;S.editI=false;S.rmd=null;render();}
  else if(d.rml){var q=d.rml.split('|'),dd3=cdel();dd3.links=dd3.links.filter(function(l,ix2){return ix2!==Number(q[1]);});render();patchDel(dd3,{links:dd3.links});}
  else if(d.act==='ddback'){S.dd=null;render();}
  else if(d.act==='ddedit'){S.editD=!S.editD;render();}
  else if(d.act==='insedit'){S.editI=!S.editI;render();}
  else if(d.act==='rmask'){S.rmd=S.dd.did;render();}
  else if(d.act==='rmcancel'){S.rmd=null;render();}
  else if(d.act==='rmgo'){var did=S.dd.did,iid=S.dd.iid;S.dd=null;S.rmd=null;post(P('/talents/'+iid+'/deliverables/'+did),'DELETE',undefined,{msg:'Deliverable removed'});}
  else if(d.act==='addq'){S.addQ=!S.addQ;render();}
  else if(d.act==='archstart'){S.archiving=true;render();}
  else if(d.act==='archcancel'){S.archiving=false;render();}
  else if(d.esec!==undefined){S.editSec=d.esec||null;render();}
  else if(d.act==='editc'){S.editC=!S.editC;render();}
  else if(d.act==='close'){S.sel=null;S.dd=null;S.editC=false;S.archiving=false;render();}
  else if(d.act==='pick'){S.pick=true;S.pickTab='Index';S.pickSel={};S.pickQ='';S.pickReg='All';S.pickMsg='';S.pqFocus=false;render();}
  else if(d.act==='pickclose'){S.pick=false;render();}
  else if(d.act==='pickadd'){var ids=Object.keys(S.pickSel),added=0;S.pick=false;
    ids.reduce(function(p,tid){return p.then(function(){return api(P('/talents'),{method:'POST',body:{talent_id:tid}}).then(function(j){FULL=hydrate(j.campaign);added++;});});},Promise.resolve()).then(function(){toast(added+' added from the Talent Index');render();}).catch(function(er){toast(er.message);loadOne();});}
  else if(d.act==='newc'){S.newc=!S.newc;render();}
  else if(d.act==='mimp'){S.mimp=!S.mimp;if(S.mimp){S.mdSel={};S.mdErr='';S.mdLoading=true;S.mdDeals=null;api('/campaigns/monday-deals').then(function(j){S.mdDeals=j.deals;S.mdLoading=false;render();}).catch(function(er){S.mdErr=er.message;S.mdLoading=false;render();});}render();}
  else if(d.act==='mimpgo'){var ids=Object.keys(S.mdSel);api('/campaigns/import-monday',{method:'POST',body:{ids:ids}}).then(function(j){S.mimp=false;toast(j.imported+' campaign'+(j.imported===1?'':'s')+' imported');return loadList();}).then(render).catch(function(er){toast(er.message);});}
});
function setTal(list){TAL=list.map(function(t){return {id:t.id,name:t.name,plat:platOf(t),region:t.region||'',niche:t.niche||''};});}
window.addEventListener('focus',function(){if(S.view==='campaign'&&FULL&&!S.pick)loadOne(true);else if(S.view==='campaigns')loadList().then(render);});
if(!TOKEN){document.getElementById('main').innerHTML='<div class="ld">Please sign in to the Talent Index first.</div>';}
else{
  render();
  api('/state').then(function(st){ROLE=st.role;ME=st.me;setTal(st.talents);return loadList();}).then(render).catch(function(e){LISTERR=e.message;READY=true;render();});
}
})();
</script>
</body>
</html>
